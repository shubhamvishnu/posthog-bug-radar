<!doctype html>
<meta charset="utf-8">
<title>Bug Radar Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.006em;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px;border:3px solid transparent;background-clip:padding-box}

:root{
--bg:#ffffff;--bg-sub:#f7f6f4;--bg-elev:#ffffff;--bg-hover:#f3f2ef;
--border:#eceae5;--border-soft:#f1efeb;--border-str:#ddd9d2;--scroll:#d9d6cf;
--text:#1a1712;--muted:#6b6860;--faint:#9c988e;
--accent:#e5482b;--accent-fg:#ffffff;
--sev-high:#e0442e;--sev-med:#bd7a17;
--oc-done:#2f9e6b;
--shadow:0 1px 2px rgba(20,16,10,.05),0 6px 18px rgba(20,16,10,.045);
--panel-grad:linear-gradient(150deg,#d5e6ff 0%,#ffe6d5 46%,#ffe1ce 62%,#d9f2e7 100%);
--bg-side:#fafaf8;--bg-active:#eeece8;--icon-tile:#181510;--icon-fg:#ffffff;
}
html[data-theme="dark"]{
--bg:#0c0d10;--bg-sub:#101116;--bg-elev:#15161b;--bg-hover:#16181d;
--border:#212228;--border-soft:#1a1b20;--border-str:#2d2f37;--scroll:#2a2c33;
--text:#eef0f3;--muted:#989ca4;--faint:#63676f;
--accent:#ff6a48;--accent-fg:#0c0d10;
--sev-high:#ff5c52;--sev-med:#e0a13c;
--oc-done:#3fce8f;
--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.3);
--panel-grad:linear-gradient(150deg,#12233b 0%,#2a1a12 50%,#122a20 100%);
--bg-side:#0a0b0d;--bg-active:#1b1d23;--icon-tile:#20222a;--icon-fg:#ffffff;
}
@keyframes fade-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- login (ported from worker/public/index.html) ---- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--panel-grad)}
.login-card{width:100%;max-width:380px;background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:32px;animation:fade-up .3s ease both}
.login-brand{display:flex;align-items:center;gap:9px;margin-bottom:22px;font-weight:600;font-size:15px}
.login-title{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.login-subtitle{font-size:13.5px;color:var(--muted);margin:6px 0 20px}
.login-label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:7px}
.login-field{display:flex;align-items:center;gap:9px;height:44px;padding:0 13px;border-radius:11px;background:var(--bg-sub);border:1px solid var(--border-str)}
.login-field input{flex:1;min-width:0;border:none;background:none;outline:none;color:var(--text);font-size:14px;height:100%}
.login-field.err{border-color:var(--accent)}
.login-error{display:flex;align-items:center;gap:6px;margin-top:8px;color:var(--accent);font-size:12.5px}
.login-primary-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;margin-top:16px;border-radius:11px;background:var(--accent);color:var(--accent-fg);font-size:14px;font-weight:600}
.login-primary-btn.disabled{opacity:.45;pointer-events:none}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- app shell ---- */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.stat-card{border:1px solid var(--border);border-radius:14px;background:var(--bg-elev);padding:18px}
.stat-card .n{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stat-card .lbl{font-size:12px;color:var(--muted);margin-top:4px}
.section-title{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;text-transform:uppercase;margin:0 0 12px}
.panel{border:1px solid var(--border);border-radius:14px;background:var(--bg-elev);padding:6px 18px}
.empty-note{color:var(--faint);font-size:13px;padding:16px 2px}

/* ---- sidebar shell (ported verbatim from worker/public/index.html) ---- */
.app{display:flex;height:100vh}
.sidebar{width:232px;flex:none;background:var(--bg-side);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;transition:width .16s ease;overflow:hidden}
.sidebar.collapsed{width:58px}
.ws-row{display:flex;align-items:center;gap:6px;padding:14px 12px 12px;justify-content:space-between}
.sidebar.collapsed .ws-row{flex-direction:column;padding:14px 0 12px;gap:10px;justify-content:center}
.ws-btn{display:flex;align-items:center;gap:9px;min-width:0;flex:1;text-align:left}
.sidebar.collapsed .ws-btn{flex:none}
.logo-tile{width:26px;height:26px;flex:none;border-radius:7px;background:var(--icon-tile);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.ws-name{font-weight:600;font-size:14px}
.sidebar.collapsed .lbl{display:none}
.collapse-btn{display:grid;place-items:center;width:26px;height:26px;flex:none;border-radius:6px;color:var(--faint)}
.collapse-btn:hover{background:var(--bg-hover)}
.side-nav{padding:6px 8px;display:flex;flex-direction:column;gap:1px}
.sidebar.collapsed .side-nav{padding:6px 0}
.nav-item{display:flex;align-items:center;gap:9px;height:31px;padding:0 9px;border-radius:7px;font-size:13px;font-weight:450;text-align:left;color:var(--muted)}
.sidebar.collapsed .nav-item{padding:0;justify-content:center}
.nav-item svg{flex:none}
.nav-item.active{color:var(--text);background:var(--bg-active);font-weight:550}
.nav-item:hover:not(.active){background:var(--bg-hover)}
.side-bottom{margin-top:auto;padding:10px 8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.sidebar.collapsed .side-bottom{padding:10px 0}
.user-row{display:flex;align-items:center;gap:9px;padding:4px;width:100%;text-align:left;border-radius:8px}
.user-row:hover{background:var(--bg-hover)}
.user-row .user-meta{min-width:0;overflow:hidden}
.user-row .user-name,.user-row .user-role{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sidebar.collapsed .user-row{justify-content:center;padding:2px 0}
.avatar{width:26px;height:26px;flex:none;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:11px}
.avatar.lg{width:48px;height:48px;font-size:17px}
.avatar.md{width:28px;height:28px;font-size:11px}
.user-meta{min-width:0}
.user-name{display:block;font-weight:500;font-size:12.5px;line-height:1.15}
.user-role{display:block;color:var(--faint);font-size:10.5px}

.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
.pageheader{height:44px;flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 20px}
.pageheader .crumb{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:5px}
.pageheader .crumb:hover{color:var(--text)}
.pageheader .sep{color:var(--faint)}
.pageheader .title{font-weight:600;font-size:13.5px}
.pageheader .idmono{font-family:'JetBrains Mono',monospace;color:var(--text);font-size:12.5px}
.pageheader .count{color:var(--faint);font-family:'JetBrains Mono',monospace;font-size:12px}
.content{flex:1;min-height:0;overflow:auto}
.contentpad{padding:26px 30px 70px}

/* ---- people / sessions list rows ---- */
.list-subhead{display:flex;align-items:center;height:34px;padding:0 20px;background:var(--bg-sub);border-bottom:1px solid var(--border);font-size:11px;letter-spacing:.02em;color:var(--faint);font-weight:500;gap:8px}
.list-row{display:flex;align-items:center;width:100%;height:42px;padding:0 20px;border-bottom:1px solid var(--border-soft);text-align:left;gap:10px}
.list-row:hover{background:var(--bg-hover)}
.col-user{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.col-user .nm{font-weight:500;font-size:13px;white-space:nowrap}
.col-user .meta{font-size:12px;color:var(--faint);font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
<div id="app"></div>
<script>
function escapeHtml(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
// CSS-property context (interpolated into a style="..." attribute), not HTML-entity context —
// HTML escaping alone doesn't stop CSS-declaration injection, so validate the shape instead.
function safeColor(c) { return /^#[0-9a-f]{6}$/i.test(c || "") ? c : "#64748b"; }

const ICON_LOGO = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="3.4" cy="12.6" r="1.7" fill="var(--accent)"/><path d="M3.4 8.4A4.2 4.2 0 0 1 7.6 12.6" stroke="var(--icon-fg)" stroke-width="1.5" stroke-linecap="round" stroke-opacity=".92"/><path d="M3.4 4.4A8.2 8.2 0 0 1 11.6 12.6" stroke="var(--icon-fg)" stroke-width="1.5" stroke-linecap="round" stroke-opacity=".5"/></svg>`;
const ICON_PEOPLE = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="9" cy="8" r="3.1"/><path d="M3.6 19c.5-3 2.8-4.6 5.4-4.6S13.9 16 14.4 19"/><path d="M16.4 5.5a3 3 0 0 1 0 5.1M18.4 19c-.3-2-1.1-3.3-2.5-4.1"/></svg>`;
const ICON_SESSIONS = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><rect x="3.5" y="4.5" width="17" height="15" rx="2.4"/><path d="M3.5 9h17M8 13h5M8 16h8"/></svg>`;
const ICON_PLUG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M9 2v6M15 2v6M7 8h10l-1 5a5 5 0 0 1-8 0z"/><path d="M12 17v5"/></svg>`;
const ICON_TARGET = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8" fill="currentColor"/></svg>`;
const ICON_TAG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M11.5 3.5H5a1.5 1.5 0 0 0-1.5 1.5v6.5L13 21l7.5-7.5z"/><circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/></svg>`;
const ICON_ACTIVITY = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M3 12h4l2.5-7L14 19l2.5-7H21"/></svg>`;
const ICON_ACTIVITY_EVENTS = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`;
const SLACK_MARK_SVG = (px) => `<svg width="${px}" height="${px}" viewBox="0 0 122 122" fill="none"><path d="M25.8 77c0 7.1-5.8 12.9-12.9 12.9S0 84.1 0 77s5.8-12.9 12.9-12.9h12.9V77z" fill="#E01E5A"/><path d="M32.3 77c0-7.1 5.8-12.9 12.9-12.9S58.1 69.9 58.1 77v32.3c0 7.1-5.8 12.9-12.9 12.9s-12.9-5.8-12.9-12.9V77z" fill="#E01E5A"/><path d="M45.2 25.8c-7.1 0-12.9-5.8-12.9-12.9S38.1 0 45.2 0s12.9 5.8 12.9 12.9v12.9H45.2z" fill="#36C5F0"/><path d="M45.2 32.3c7.1 0 12.9 5.8 12.9 12.9S52.3 58.1 45.2 58.1H12.9C5.8 58.1 0 52.3 0 45.2s5.8-12.9 12.9-12.9h32.3z" fill="#36C5F0"/><path d="M96.2 45.2c0-7.1 5.8-12.9 12.9-12.9s12.9 5.8 12.9 12.9-5.8 12.9-12.9 12.9H96.2V45.2z" fill="#2EB67D"/><path d="M89.7 45.2c0 7.1-5.8 12.9-12.9 12.9S63.9 52.3 63.9 45.2V12.9C63.9 5.8 69.7 0 76.8 0s12.9 5.8 12.9 12.9v32.3z" fill="#2EB67D"/><path d="M76.8 96.2c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9-12.9-5.8-12.9-12.9V96.2h12.9z" fill="#ECB22E"/><path d="M76.8 89.7c-7.1 0-12.9-5.8-12.9-12.9s5.8-12.9 12.9-12.9h32.3c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9H76.8z" fill="#ECB22E"/></svg>`;

function getTheme() { return localStorage.getItem("bra_theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }

const AUTH = { email: null };
const loginState = { email: "", password: "", error: "", submitting: false };
const state = { view: "overview", selUserEmail: null, expandedTask: {}, expandedMoments: {}, selSessionId: null, selSessionOwner: null };

let OVERVIEW = { userCount: 0, connectionCount: 0, reportCount: 0, connectionsByStatus: {}, slackConnectedCount: 0, failingConnectionCount: 0 };
let EVENTS = [];
let USERS = [];
let USER_DETAIL = null;
let SESSIONS = [];
let SESSIONS_SCANNED = 0;
let TOTAL_SESSIONS = 0;
let SESSION_DETAIL = null;
let CONNECTIONS = [];
let GOALS = []; let GOALS_TOTAL = 0;
let TAGS = []; let TAGS_TOTAL = 0;
let SLACK_TENANTS = [];

const AUDIT_STATUS_VAR = { success: "var(--oc-done)", warning: "var(--sev-med)", error: "var(--sev-high)", info: "var(--faint)" };
const AUDIT_KIND_LABEL = { connection_established: "Connection established", settings_changed: "Settings changed", resync: "Re-sync", sync_completed: "Sync completed", sync_failed: "Sync failed" };

function relTimeLabel(iso) {
  const ts = iso.includes("T") ? iso : iso.replace(" ", "T") + "Z";
  const mins = Math.max(0, Math.round((Date.now() - new Date(ts).getTime()) / 60000));
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.round(hrs / 24)}d ago`;
}

function auditRowHtml(ev, opts) {
  opts = opts || {};
  return `
  <div style="display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--border-soft)">
    <span style="width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;background:${AUDIT_STATUS_VAR[ev.status] || "var(--faint)"}"></span>
    <div style="min-width:0;flex:1">
      <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
        <span style="font-size:13px;font-weight:600">${escapeHtml(ev.title || AUDIT_KIND_LABEL[ev.kind] || ev.kind)}</span>
        ${opts.showOwner && ev.owner_email ? `<button data-act="open-user" data-email="${escapeHtml(ev.owner_email)}" style="font-size:11.5px;color:var(--accent);font-weight:500">${escapeHtml(ev.owner_email)}</button>` : ""}
        ${opts.showOwner && ev.project_name ? `<span style="font-size:11.5px;color:var(--faint)">${escapeHtml(ev.project_name)}</span>` : ""}
        <span style="font-size:11.5px;color:var(--faint)">${escapeHtml(ev.trigger_label || "")}</span>
      </div>
      ${ev.detail ? `<div style="font-size:12px;color:var(--muted);line-height:1.45;margin-top:2px">${escapeHtml(ev.detail)}</div>` : ""}
    </div>
    <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);flex:none;white-space:nowrap;margin-top:1px">${escapeHtml(relTimeLabel(ev.created_at))}</span>
  </div>`;
}

async function loadOverview() {
  const [ovRes, evRes] = await Promise.all([fetch("/api/overview"), fetch("/api/events?limit=100")]);
  if (ovRes.ok) OVERVIEW = await ovRes.json();
  if (evRes.ok) EVENTS = await evRes.json();
}

async function loadUsers() {
  const res = await fetch("/api/users");
  if (res.ok) USERS = await res.json();
}

async function loadSessions() {
  const res = await fetch("/api/sessions?limit=200");
  if (res.ok) { const data = await res.json(); SESSIONS = data.sessions; SESSIONS_SCANNED = data.scanned_reports; TOTAL_SESSIONS = data.total_sessions; }
  // The nav click handler calls render() synchronously right after kicking this off, so on the
  // very first visit to Sessions (nothing preloaded it, unlike Tenants via init()) that render
  // paints before this fetch resolves and nothing repaints it — re-render once data lands.
  render();
}

async function loadConnections() {
  const res = await fetch("/api/connections");
  if (res.ok) CONNECTIONS = (await res.json()).connections;
  // The nav click handler calls render() synchronously right after kicking this off, so on the
  // very first visit to Integrations (nothing preloaded it, unlike Tenants via init()) that render
  // paints before this fetch resolves and nothing repaints it — re-render once data lands.
  render();
}

async function loadGoals() {
  const res = await fetch("/api/goals");
  if (res.ok) { const d = await res.json(); GOALS = d.goals; GOALS_TOTAL = d.total; }
  render();
}

async function loadTags() {
  const res = await fetch("/api/tags");
  if (res.ok) { const d = await res.json(); TAGS = d.tags; TAGS_TOTAL = d.total; }
  render();
}

async function loadSlackTenants() {
  const res = await fetch("/api/slack");
  if (res.ok) SLACK_TENANTS = (await res.json()).tenants;
  render();
}

let AI_PROVIDERS_DATA = null;
let AI_PROVIDER_FORMS = null;
let AI_TENANT_FORM = null;

async function loadAiProviders() {
  const res = await fetch("/api/admin/ai-providers");
  if (res.ok) AI_PROVIDERS_DATA = await res.json();
  render();
}

function initAiProviderForms() {
  AI_PROVIDER_FORMS = {};
  for (const p of ["anthropic", "openai", "gemini"]) {
    const d = AI_PROVIDERS_DATA[p];
    const catalog = AI_MODEL_CATALOG[p];
    const model = d.default_model || catalog[0];
    const isOther = !catalog.includes(model);
    AI_PROVIDER_FORMS[p] = { model: isOther ? "other" : model, customModel: isOther ? model : "", keyEditing: false, newKey: "" };
  }
}

async function saveAiProvider(provider) {
  const form = AI_PROVIDER_FORMS[provider];
  const model = form.model === "other" ? form.customModel.trim() : form.model;
  if (!model) return;
  const body = { default_model: model };
  if (form.keyEditing && form.newKey.trim()) body.api_key = form.newKey.trim();
  const res = await fetch(`/api/admin/ai-providers/${provider}`, {
    method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
  });
  if (res.ok) {
    form.keyEditing = false;
    form.newKey = "";
    await loadAiProviders();
  } else {
    render();
  }
}

async function loadTenantAiConfig(email) {
  const res = await fetch(`/api/admin/ai-config/${encodeURIComponent(email)}`);
  if (res.ok) {
    const d = await res.json();
    const catalog = AI_MODEL_CATALOG[d.provider];
    const isOther = !catalog.includes(d.model);
    AI_TENANT_FORM = {
      provider: d.provider,
      model: isOther ? "other" : d.model,
      customModel: isOther ? d.model : "",
      useCustomKey: d.has_custom_key,
      newKey: "",
      keyEditing: false,
      isOverride: d.is_override,
      maskedKey: d.masked_key,
    };
  }
  render();
}

async function saveTenantAiConfig(email) {
  const form = AI_TENANT_FORM;
  const model = form.model === "other" ? form.customModel.trim() : form.model;
  if (!model) return;
  const body = { provider: form.provider, model, use_custom_key: form.useCustomKey };
  if (form.useCustomKey && form.keyEditing && form.newKey.trim()) body.api_key = form.newKey.trim();
  const res = await fetch(`/api/admin/ai-config/${encodeURIComponent(email)}`, {
    method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
  });
  if (res.ok) { await loadTenantAiConfig(email); } else { render(); }
}

async function openSession(sessionId, ownerEmail) {
  state.view = "session-detail";
  state.selSessionId = sessionId;
  state.selSessionOwner = ownerEmail;
  SESSION_DETAIL = null;
  render();
  const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}?owner_email=${encodeURIComponent(ownerEmail)}`);
  if (state.selSessionId !== sessionId) return;
  if (res.ok) SESSION_DETAIL = await res.json();
  render();
}

async function openUser(email) {
  state.view = "user-detail";
  state.selUserEmail = email;
  USER_DETAIL = null;
  AI_TENANT_FORM = null;
  render();
  const res = await fetch(`/api/users/${encodeURIComponent(email)}`);
  if (state.selUserEmail !== email) return; // a newer click superseded this request
  if (res.ok) {
    USER_DETAIL = await res.json();
    // The embedded first page is capped at 10 rows (see /api/users/:email), so a full
    // page means there may be more; a short page means this is everything.
    USER_DETAIL.reportHistoryHasMore = (USER_DETAIL.report_history || []).length === 10;
  }
  loadTenantAiConfig(email);
  render();
}

      <span style="color:var(--faint)">${u.last_activity ? relTimeLabel(u.last_activity) : "no activity"}</span>
      <span style="color:${u.slack_status === "connected" ? "var(--oc-done)" : "var(--faint)"}">${u.slack_status === "connected" ? "Slack connected" : "No Slack"}</span>

  const color = status === "healthy" ? "var(--oc-done)" : status === "error" ? "var(--sev-high)" : "var(--faint)";

}

function renderGoalsLibrary() {

}

    ${corrections.length ? `<div style="display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 2fr;gap:12px;padding:10px 0;font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.03em">
      <span>Task</span><span>Field</span><span>Change</span><span>Date</span><span>Reason</span>

const SEV_VAR = { high: "var(--sev-high)", medium: "var(--sev-med)", low: "var(--faint)", none: "var(--faint)" };
const SEV_TEXT = { high: "High", medium: "Medium", low: "Low", none: "None" };

const AI_MODEL_CATALOG = {
  anthropic: ["claude-opus-5", "claude-sonnet-5", "claude-haiku-4-5"],
  openai: ["gpt-5.6-sol", "gpt-5.6-terra", "gpt-5.6-luna"],
  gemini: ["gemini-3.1-pro-preview", "gemini-3.7-flash", "gemini-3.5-flash"],
};
const AI_PROVIDER_LABEL = { anthropic: "Anthropic", openai: "OpenAI", gemini: "Gemini" };

function sevOf(t) { return t.severity || "none"; }

function tagChipHtml(tag) {
  if (!tag) return "";
  const color = safeColor(tag.color);
  return `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:4px 8px;border-radius:20px;color:${color};background:color-mix(in srgb,${color} 13%,transparent);border:1px solid color-mix(in srgb,${color} 28%,transparent)">${escapeHtml(tag.label)}</span>`;
}

function taskTagsHtml(t, tagsList) {
  const tagIds = (t.tags || []).map(tg => tg.tag_id);
  const defs = (tagsList || []).filter(d => tagIds.includes(d.id));
  return defs.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">${defs.map(tagChipHtml).join("")}</div>` : "";
}

function taskGoalBadgeHtml(t, goalsList) {
  if (!t.goal_id) return "";
  const goal = (goalsList || []).find(g => g.id === t.goal_id);
  if (!goal) return "";
  return `<div style="font-size:12px;color:var(--muted);margin:6px 0"><span style="color:var(--faint)">Goal ·</span> ${escapeHtml(goal.purpose)}</div>`;
}

function toggleTask(key) {
  state.expandedTask[key] = !state.expandedTask[key];
  render();
}

function toggleMoments(key) {
  state.expandedMoments[key] = !state.expandedMoments[key];
  render();
}

function renderCapturedMomentsRO(f, ti, t) {
  const media = t.media || [];
  if (!media.length) return "";
  const key = `${f.session_id}:${ti}`;
  const shown = !!state.expandedMoments[key];
  // task.media[].url is stored as "/api/media/<key>" (main app's own route shape); worker-admin
  // serves the identical path shape from its own /api/media/:key proxy, so it's used as-is.
  const grid = media.map(m => `
    <div style="position:relative;width:120px;height:76px;flex:none;border-radius:8px;overflow:hidden;background:var(--bg-sub)">
      ${m.url ? `<img src="${escapeHtml(m.url)}" alt="Captured moment" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'"/>` : ""}
      <span style="position:absolute;left:6px;bottom:5px;font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)">${escapeHtml(m.ts || "")}</span>
    </div>`).join("");
  return `
  <div style="margin-top:10px">
    <button data-act="toggle-moments" data-key="${escapeHtml(key)}" style="font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px">CAPTURED MOMENTS <span style="color:var(--faint)">${media.length}</span></button>
    ${shown ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">${grid}</div>` : ""}
  </div>`;
}

function renderTaskCardRO(f, ti, t, ctx) {
  const key = `${f.session_id}:${ti}`;
  const open = !!state.expandedTask[key];
  return `
  <div style="border-top:1px solid var(--border-soft)">
    <button data-act="toggle-task" data-key="${escapeHtml(key)}" style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 0">
      <span style="font-size:13px;font-weight:600;flex:1;min-width:0">${escapeHtml(t.title)}</span>
      <span style="font-size:11.5px;font-weight:500;color:${SEV_VAR[sevOf(t)]}">${escapeHtml(sevOf(t))}</span>
      <span style="width:7px;height:7px;border-radius:50%;background:${t.real_bug ? "var(--sev-high)" : "var(--faint)"}" title="${t.real_bug ? "Real bug" : "Not a bug"}"></span>
    </button>
    ${open ? `
    <div style="padding-bottom:14px">
      ${taskGoalBadgeHtml(t, ctx.goals)}
      ${taskTagsHtml(t, ctx.tags)}
      <p style="font-size:12.5px;color:var(--muted);line-height:1.55;margin:6px 0">${escapeHtml(t.narrative || "")}</p>
      ${renderCapturedMomentsRO(f, ti, t)}
    </div>` : ""}
  </div>`;
}

function renderSessionCardRO(f, ctx) {
  const tasks = f.tasks || [];
  return `
  <div class="panel" style="margin-bottom:12px">
    <div style="padding:14px 0 4px;display:flex;align-items:center;gap:10px">
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint)">${escapeHtml((f.session_id || "").slice(0, 12))}</span>
      <span style="font-size:12px;color:var(--muted)">${tasks.length} task${tasks.length === 1 ? "" : "s"}</span>
      ${f.recommended_outreach ? `<span style="margin-left:auto;font-size:10.5px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:2px 8px;border-radius:6px">Outreach recommended</span>` : ""}
    </div>
    ${tasks.map((t, ti) => renderTaskCardRO(f, ti, t, ctx)).join("")}
  </div>`;
}

async function loadMoreReports() {
  const history = USER_DETAIL.report_history || [];
  const oldestId = history.length ? history[history.length - 1].id : null;
  if (!oldestId) return;
  const res = await fetch(`/api/users/${encodeURIComponent(state.selUserEmail)}/reports?before_id=${oldestId}`);
  if (!res.ok) return;
  const data = await res.json();
  USER_DETAIL.report_history = [...history, ...data.report_history];
  // Whether to keep offering "Load more" depends on the size of the page just
  // fetched, not the accumulated total (which can land on a multiple of 10).
  USER_DETAIL.reportHistoryHasMore = (data.report_history || []).length === 10;
  render();
}

function renderLatestReportSection() {
  const report = USER_DETAIL.latest_report;
  const history = USER_DETAIL.report_history || [];
  const historyHtml = history.length ? `
    <div style="font-size:11.5px;color:var(--faint);margin:10px 0 8px">
      ${history.map(r => `${escapeHtml(String(r.generated_at || "").slice(0, 10))} · ${r.task_count} tasks`).join(" &nbsp;·&nbsp; ")}
    </div>
    ${history.length > 0 && USER_DETAIL.reportHistoryHasMore ? `<button data-act="load-more-reports" style="font-size:12px;color:var(--accent);margin-bottom:18px">Load more</button>` : ""}` : "";
  if (!report) {
    return `<div class="section-title">Latest report</div><div class="panel"><div class="empty-note">No report yet.</div></div>${historyHtml}`;
  }
  const findings = report.micro_findings || [];
  return `
  <div class="section-title">Latest report<span style="margin-left:8px;font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--faint)">${escapeHtml(String(report.generated_at || "").slice(0, 10))}</span></div>
  ${historyHtml}
  ${findings.length ? findings.map(f => renderSessionCardRO(f, { tags: USER_DETAIL.tags || [], goals: USER_DETAIL.goals || [] })).join("") : `<div class="panel"><div class="empty-note">No sessions in this report.</div></div>`}`;
}

function renderTenantSlackSection() {
  const slack = USER_DETAIL.slack;
  return `
  <div class="section-title">Slack</div>
  <div class="panel" style="padding:14px 18px">
    ${slack
      ? `<div style="display:flex;align-items:center;gap:10px;font-size:13px">
           ${SLACK_MARK_SVG(18)}
           <span style="font-weight:600">${escapeHtml(slack.team_name)}</span>
           <span style="color:${slack.status === "connected" ? "var(--oc-done)" : "var(--faint)"}">${escapeHtml(slack.status)}</span>
           <span style="color:var(--muted);margin-left:auto">${slack.rule_count} rule${slack.rule_count === 1 ? "" : "s"}</span>
         </div>`
      : `<div class="empty-note">Not connected.</div>`}
  </div>`;
}

function renderTenantAiSection() {
  if (!AI_TENANT_FORM) return `<div class="section-title">AI Routing</div><div class="panel" style="padding:16px 18px"><div class="empty-note">Loading…</div></div>`;

    .map(p => `<option value="${p}"${form.provider === p ? " selected" : ""}>${escapeHtml(AI_PROVIDER_LABEL[p])}</option>`).join("");
  const catalog = AI_MODEL_CATALOG[form.provider];
  const modelOptions = catalog.map(m => `<option value="${escapeHtml(m)}"${form.model === m ? " selected" : ""}>${escapeHtml(m)}</option>`).join("")
    + `<option value="other"${form.model === "other" ? " selected" : ""}>Other (custom)</option>`;
  return `
  <div class="section-title">AI Routing${form.isOverride ? "" : `<span style="margin-left:8px;font-size:10.5px;font-weight:600;color:var(--faint);background:var(--bg-sub);padding:2px 7px;border-radius:6px">ORG DEFAULT</span>`}</div>
  <div class="panel" style="padding:16px 18px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="font-size:12.5px;color:var(--muted);width:70px">Provider</span>
      <select data-ai-tenant-provider style="height:34px;padding:0 8px;border-radius:8px;border:1px solid var(--border-str);background:var(--bg-sub);color:var(--text)">${providerOptions}</select>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="font-size:12.5px;color:var(--muted);width:70px">Model</span>
      <select data-ai-tenant-model style="height:34px;padding:0 8px;border-radius:8px;border:1px solid var(--border-str);background:var(--bg-sub);color:var(--text)">${modelOptions}</select>
      ${form.model === "other" ? `<input data-ai-tenant-custom-model type="text" placeholder="model-id" value="${escapeHtml(form.customModel)}" style="height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--border-str);background:var(--bg-sub);color:var(--text)"/>` : ""}
    </div>
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:10px">
      <span style="font-size:12.5px;color:var(--muted);width:70px">API key</span>
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px"><input type="radio" name="aiTenantKeyMode" data-ai-tenant-key-mode="default" ${!form.useCustomKey ? "checked" : ""}/> Org default</label>
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px"><input type="radio" name="aiTenantKeyMode" data-ai-tenant-key-mode="custom" ${form.useCustomKey ? "checked" : ""}/> Custom for this tenant</label>
    </div>
    ${form.useCustomKey ? `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="font-size:12.5px;color:var(--muted);width:70px"></span>
      ${form.keyEditing
        ? `<input data-ai-tenant-key-input type="password" placeholder="Paste new key" value="${escapeHtml(form.newKey)}" style="flex:1;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--border-str);background:var(--bg-sub);color:var(--text)"/>`
        : `<span style="font-family:'JetBrains Mono',monospace;font-size:13px">${escapeHtml(form.maskedKey || "not set")}</span>
           <button data-act="ai-tenant-edit-key" style="font-size:12px;color:var(--accent)">Update key</button>`}
    </div>` : ""}
    <button data-act="ai-tenant-save" data-email="${escapeHtml(state.selUserEmail)}" class="login-primary-btn" style="width:auto;padding:0 18px;height:34px;margin-top:2px">Save</button>
  </div>`;
}

function renderUserDetail() {
  if (!USER_DETAIL) return `<div class="pageheader"><button class="crumb" data-act="nav" data-view="tenants">Tenants</button></div><div class="content contentpad"><div class="empty-note">Loading…</div></div>`;

    <button class="crumb" data-act="nav" data-view="tenants">Tenants</button>
    <span class="sep">/</span>
    <span class="idmono">${escapeHtml(u.user.email)}</span>
  </div>
  <div class="content contentpad">
    <div style="font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:2px">${escapeHtml(u.user.email)}</div>

function renderEventsScreen() {

  <div class="pageheader"><span class="title">Events</span><span class="count">${EVENTS.length}</span></div>

function renderSessionsScreen() {
  const rows = SESSIONS.map(s => `
    <button class="list-row" data-act="open-session" data-id="${escapeHtml(s.session_id)}" data-owner="${escapeHtml(s.owner_email)}">
      <span class="col-user">
        <span class="avatar">${escapeHtml((s.owner_email || "?")[0].toUpperCase())}</span>
        <span style="min-width:0;overflow:hidden;display:flex;align-items:baseline;gap:8px">
          <span class="nm">${escapeHtml(s.owner_email)}</span>
          <span class="meta">${escapeHtml((s.session_id || "").slice(0, 12))}</span>
        </span>
      </span>
      <span style="width:90px">${SEV_TEXT[s.worst_severity]}</span>
      <span style="width:70px">${s.bug_count} bug${s.bug_count === 1 ? "" : "s"}</span>
      <span style="width:90px;text-align:right;color:var(--faint)">${escapeHtml(String(s.timestamp || "").slice(0, 10))}</span>

  return `
  <div class="pageheader"><span class="title">Sessions</span><span class="count">${SESSIONS.length}</span></div>
  <div class="list-subhead"><span style="flex:1">Owner / session</span><span style="width:90px">Worst severity</span><span style="width:70px">Bugs</span><span style="width:90px;text-align:right">Date</span></div>

    ${rows || `<div class="empty-note">No sessions yet.</div>`}

  </div>`;
}

function renderIntegrationsScreen() {
  const rows = CONNECTIONS.map(c => `
    <button class="list-row" data-act="open-user" data-email="${escapeHtml(c.owner_email)}">
      <span class="col-user">
        <span class="avatar">${escapeHtml((c.owner_email || "?")[0].toUpperCase())}</span>
        <span style="min-width:0;overflow:hidden;display:flex;align-items:baseline;gap:8px">
          <span class="nm">${escapeHtml(c.owner_email)}</span>
          <span class="meta">${escapeHtml(c.project_name || "")}</span>
        </span>
      </span>
      <span style="width:100px"><span style="padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600;${connChipStyle(c.status)}">${escapeHtml(c.status)}</span></span>
      <span style="width:200px;color:var(--sev-high);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(c.last_error || "")}</span>
      <span style="width:110px;text-align:right;color:var(--faint)">${c.last_synced_at ? escapeHtml(String(c.last_synced_at).slice(0, 10)) : "never"}</span>

  return `
  <div class="pageheader"><span class="title">Integrations</span><span class="count">${CONNECTIONS.length}</span></div>

function renderGoalsScreen() {
  const rows = GOALS.map(g => `
    <div class="list-row" style="cursor:default">
      <span class="col-user">
        <span style="min-width:0;overflow:hidden;display:flex;align-items:baseline;gap:8px">
          <span class="nm">${escapeHtml(g.purpose)}</span>

        </span>
      </span>
      <span style="width:70px"><span style="font-size:10.5px;font-weight:600;color:var(--faint);background:var(--bg-sub);padding:2px 7px;border-radius:6px">${g.source === "auto" ? "AUTO" : "USER"}</span></span>
      <span style="width:90px;text-align:right;color:var(--faint)">${escapeHtml(String(g.created_at || "").slice(0, 10))}</span>
    </div>`).join("");
  return `
  <div class="pageheader"><span class="title">Goals</span><span class="count">${GOALS.length}</span></div>
  <div class="list-subhead"><span style="flex:1">Purpose / owner</span><span style="width:70px">Source</span><span style="width:90px;text-align:right">Created</span></div>
  <div class="content">
    ${rows || `<div class="empty-note">No goals yet.</div>`}
    ${GOALS_TOTAL > GOALS.length ? `<div class="empty-note">Showing latest ${GOALS.length} of ${GOALS_TOTAL} total.</div>` : ""}
  </div>`;
}

function renderTagsScreen() {
  const rows = TAGS.map(t => `
    <div class="list-row" style="cursor:default">
      <span class="col-user">
        <span style="min-width:0;overflow:hidden;display:flex;align-items:baseline;gap:8px">
          ${tagChipHtml(t)}
          <span class="meta">${escapeHtml(t.owner_email)}</span>
        </span>
      </span>
      <span style="width:70px"><span style="font-size:10.5px;font-weight:600;color:var(--faint);background:var(--bg-sub);padding:2px 7px;border-radius:6px">${t.source === "auto" ? "AUTO" : "USER"}</span></span>
      <span style="width:90px;text-align:right;color:var(--faint)">${escapeHtml(String(t.created_at || "").slice(0, 10))}</span>
    </div>`).join("");
  return `
  <div class="pageheader"><span class="title">Tags</span><span class="count">${TAGS.length}</span></div>
  <div class="list-subhead"><span style="flex:1">Label / owner</span><span style="width:70px">Source</span><span style="width:90px;text-align:right">Created</span></div>
  <div class="content">
    ${rows || `<div class="empty-note">No tags yet.</div>`}
    ${TAGS_TOTAL > TAGS.length ? `<div class="empty-note">Showing latest ${TAGS.length} of ${TAGS_TOTAL} total.</div>` : ""}

function renderSessionDetailScreen() {
  if (!SESSION_DETAIL) return `<div class="pageheader"><button class="crumb" data-act="nav" data-view="sessions">Sessions</button></div><div class="content contentpad"><div class="empty-note">Loading…</div></div>`;
  const ctx = { tags: SESSION_DETAIL.tags || [], goals: SESSION_DETAIL.goals || [] };
  return `
  <div class="pageheader">
    <button class="crumb" data-act="nav" data-view="sessions">Sessions</button>
    <span class="sep">/</span>
    <span class="idmono">${escapeHtml((SESSION_DETAIL.session.session_id || "").slice(0, 16))}</span>
  </div>
  <div class="content contentpad">
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:16px">${escapeHtml(SESSION_DETAIL.owner_email)}</div>
    ${renderSessionCardRO(SESSION_DETAIL.session, ctx)}
  </div>`;

function renderSlackScreen() {
  const rows = SLACK_TENANTS.map(t => `
    <button class="list-row" data-act="open-user" data-email="${escapeHtml(t.owner_email)}">
      <span class="col-user">
        <span class="avatar">${escapeHtml((t.owner_email || "?")[0].toUpperCase())}</span>
        <span style="min-width:0;overflow:hidden;display:flex;align-items:baseline;gap:8px">
          <span class="nm">${escapeHtml(t.owner_email)}</span>
          <span class="meta">${escapeHtml(t.team_name)}</span>
        </span>
      </span>
      <span style="width:100px;color:${t.status === "connected" ? "var(--oc-done)" : "var(--faint)"}">${escapeHtml(t.status)}</span>
      <span style="width:90px;text-align:right;color:var(--muted)">${t.rule_count} rule${t.rule_count === 1 ? "" : "s"}</span>
    </button>`).join("");
  return `
  <div class="pageheader"><span class="title">Slack</span><span class="count">${SLACK_TENANTS.length}</span></div>
  <div class="list-subhead"><span style="flex:1">Owner / workspace</span><span style="width:100px">Status</span><span style="width:90px;text-align:right">Rules</span></div>
  <div class="content">${rows || `<div class="empty-note">No tenants have connected Slack yet.</div>`}</div>`;
}

function renderAiProvidersScreen() {
  if (!AI_PROVIDERS_DATA) return `<div class="pageheader"><span class="title">AI Providers</span></div><div class="content contentpad"><div class="empty-note">Loading…</div></div>`;
  if (!AI_PROVIDER_FORMS) initAiProviderForms();
  const cards = ["anthropic", "openai", "gemini"].map(p => renderAiProviderCard(p)).join("");
  return `
  <div class="pageheader"><span class="title">AI Providers</span></div>
  <div class="content contentpad">${cards}</div>`;
}

function renderAiProviderCard(provider) {
  const d = AI_PROVIDERS_DATA[provider];
  const form = AI_PROVIDER_FORMS[provider];
  const catalog = AI_MODEL_CATALOG[provider];
  const modelOptions = catalog.map(m => `<option value="${escapeHtml(m)}"${form.model === m ? " selected" : ""}>${escapeHtml(m)}</option>`).join("")
    + `<option value="other"${form.model === "other" ? " selected" : ""}>Other (custom)</option>`;
  return `
  <div class="panel" style="margin-bottom:14px;padding:16px 18px">
    <div style="font-weight:700;font-size:15.5px;margin-bottom:10px">${escapeHtml(AI_PROVIDER_LABEL[provider])}</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="font-size:12.5px;color:var(--muted);width:70px">API key</span>
      ${form.keyEditing
        ? `<input data-ai-key-input="${provider}" type="password" placeholder="Paste new key" value="${escapeHtml(form.newKey)}" style="flex:1;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--border-str);background:var(--bg-sub);color:var(--text)"/>`
        : `<span style="font-family:'JetBrains Mono',monospace;font-size:13px">${d.configured ? escapeHtml(d.masked_key) : "not set"}</span>
           <button data-act="ai-provider-edit-key" data-provider="${provider}" style="font-size:12px;color:var(--accent)">Update key</button>`}
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="font-size:12.5px;color:var(--muted);width:70px">Model</span>
      <select data-ai-model-select="${provider}" style="height:34px;padding:0 8px;border-radius:8px;border:1px solid var(--border-str);background:var(--bg-sub);color:var(--text)">${modelOptions}</select>
      ${form.model === "other" ? `<input data-ai-custom-model="${provider}" type="text" placeholder="model-id" value="${escapeHtml(form.customModel)}" style="height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--border-str);background:var(--bg-sub);color:var(--text)"/>` : ""}
    </div>
    <button data-act="ai-provider-save" data-provider="${provider}" class="login-primary-btn" style="width:auto;padding:0 18px;height:34px;margin-top:2px">Save</button>
  </div>`;
}

/* ---------------- login (password-based) ---------------- */
async function submitLogin(e) {
  e.preventDefault();
  loginState.error = "";
  loginState.submitting = true;
  render();
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ email: loginState.email, password: loginState.password }),
    });
    const data = await res.json().catch(() => ({}));
    loginState.submitting = false;
    if (!res.ok) { loginState.error = data.error || "Something went wrong. Try again."; render(); return; }
    AUTH.email = data.email;
    await loadOverview();
    await loadUsers();
    render();
  } catch (err) {
    loginState.submitting = false;
    loginState.error = "Network error. Try again.";
    render();
  }
}

function renderLoginShell() {
  const s = loginState;
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">Bug Radar Admin</div>
      <div class="login-title">Bug Radar Admin</div>
      <div class="login-subtitle">Sign in with the admin account.</div>
      <form id="loginForm">
        <label class="login-label">Email</label>
        <div class="login-field${s.error ? " err" : ""}">
          <input id="loginEmailInput" type="email" placeholder="you@company.com" autocomplete="email" value="${escapeHtml(s.email)}"/>
        </div>
        <label class="login-label" style="margin-top:14px">Password</label>
        <div class="login-field${s.error ? " err" : ""}">
          <input id="loginPasswordInput" type="password" placeholder="••••••••" autocomplete="current-password" value="${escapeHtml(s.password)}"/>
        </div>
        ${s.error ? `<div class="login-error">${escapeHtml(s.error)}</div>` : ""}
        <button type="submit" class="login-primary-btn${s.submitting ? " disabled" : ""}">
          ${s.submitting ? `<span class="spinner"></span>` : `<span>Sign in</span>`}
        </button>
      </form>
    </div>
  </div>`;
}

/* ---------------- main render ---------------- */
function renderMainContent() {
  switch (state.view) {
    case "overview": return renderOverview();
    case "tenants": return renderUsersTable();
    case "user-detail": return renderUserDetail();
    case "integrations": return renderIntegrationsScreen();
    case "goals": return renderGoalsScreen();
    case "tags": return renderTagsScreen();
    case "slack": return renderSlackScreen();
    case "sessions": return renderSessionsScreen();
    case "session-detail": return renderSessionDetailScreen();
    case "events": return renderEventsScreen();
    case "ai-providers": return renderAiProvidersScreen();
    default: return "";
  }
}

function renderSidebar() {
  const v = state.view;
  const isTenants = v === "tenants" || v === "user-detail";
  return `
  <aside class="sidebar">
    <div class="ws-row">
      <button class="ws-btn" data-act="nav" data-view="overview">
        <span class="logo-tile">${ICON_LOGO}</span>
        <span class="lbl ws-name">Bug Radar Admin</span>
      </button>
    </div>
    <nav class="side-nav">
      <button class="nav-item${v === "overview" ? " active" : ""}" data-act="nav" data-view="overview">${ICON_ACTIVITY}<span class="lbl">Overview</span></button>
      <button class="nav-item${isTenants ? " active" : ""}" data-act="nav" data-view="tenants">${ICON_PEOPLE}<span class="lbl">Tenants</span></button>
      <button class="nav-item${v === "sessions" || v === "session-detail" ? " active" : ""}" data-act="nav" data-view="sessions">${ICON_SESSIONS}<span class="lbl">Sessions</span></button>
      <button class="nav-item${v === "integrations" ? " active" : ""}" data-act="nav" data-view="integrations">${ICON_PLUG}<span class="lbl">Integrations</span></button>
      <button class="nav-item${v === "goals" ? " active" : ""}" data-act="nav" data-view="goals">${ICON_TARGET}<span class="lbl">Goals</span></button>
      <button class="nav-item${v === "tags" ? " active" : ""}" data-act="nav" data-view="tags">${ICON_TAG}<span class="lbl">Tags</span></button>
      <button class="nav-item${v === "slack" ? " active" : ""}" data-act="nav" data-view="slack">${SLACK_MARK_SVG(16)}<span class="lbl">Slack</span></button>
      <button class="nav-item${v === "ai-providers" ? " active" : ""}" data-act="nav" data-view="ai-providers">${ICON_TARGET}<span class="lbl">AI Providers</span></button>
      <button class="nav-item${v === "events" ? " active" : ""}" data-act="nav" data-view="events">${ICON_ACTIVITY_EVENTS}<span class="lbl">Events</span></button>
    </nav>
    <div class="side-bottom">
      <div style="display:flex;align-items:center;gap:9px;padding:4px">
        <span class="avatar md">${escapeHtml((AUTH.email || "?")[0].toUpperCase())}</span>
        <span class="user-meta" style="min-width:0;overflow:hidden">
          <span class="user-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(AUTH.email || "")}</span>
        </span>
      </div>
      <button data-act="logout" style="font-size:12.5px;color:var(--muted);text-align:left;padding:6px 4px">Log out</button>
    </div>
  </aside>`;
}

function render() {
  document.documentElement.setAttribute("data-theme", getTheme());
  const app = document.getElementById("app");
  if (!AUTH.email) {
    app.innerHTML = renderLoginShell();
    return;
  }
  app.innerHTML = `<div class="app">${renderSidebar()}<main class="main">${renderMainContent()}</main></div>`;
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "logout") logout();
  else if (act === "nav") {
    state.view = el.dataset.view;
    if (el.dataset.view === "tenants" && !USERS.length) loadUsers();
    if (el.dataset.view === "integrations" && !CONNECTIONS.length) loadConnections();
    if (el.dataset.view === "goals" && !GOALS.length) loadGoals();
    if (el.dataset.view === "tags" && !TAGS.length) loadTags();
    if (el.dataset.view === "slack" && !SLACK_TENANTS.length) loadSlackTenants();
    if (el.dataset.view === "sessions" && !SESSIONS.length) loadSessions();
    if (el.dataset.view === "ai-providers" && !AI_PROVIDERS_DATA) loadAiProviders();
    render();
  }
  else if (act === "open-user") { openUser(el.dataset.email); }
  else if (act === "open-session") { openSession(el.dataset.id, el.dataset.owner); }
  else if (act === "toggle-task") { toggleTask(el.dataset.key); }
  else if (act === "toggle-moments") { toggleMoments(el.dataset.key); }
  else if (act === "load-more-reports") { loadMoreReports(); }
  else if (act === "ai-provider-edit-key") { AI_PROVIDER_FORMS[el.dataset.provider].keyEditing = true; render(); }
  else if (act === "ai-provider-save") { saveAiProvider(el.dataset.provider); }
  else if (act === "ai-tenant-edit-key") { AI_TENANT_FORM.keyEditing = true; render(); }
  else if (act === "ai-tenant-save") { saveTenantAiConfig(el.dataset.email); }
});

document.addEventListener("input", e => {
  if (e.target.id === "loginEmailInput") { loginState.email = e.target.value; loginState.error = ""; }
  if (e.target.id === "loginPasswordInput") { loginState.password = e.target.value; loginState.error = ""; }
  if (e.target.dataset.aiKeyInput) { AI_PROVIDER_FORMS[e.target.dataset.aiKeyInput].newKey = e.target.value; }
  if (e.target.dataset.aiCustomModel) { AI_PROVIDER_FORMS[e.target.dataset.aiCustomModel].customModel = e.target.value; }
  if (e.target.dataset.aiTenantCustomModel !== undefined) { AI_TENANT_FORM.customModel = e.target.value; }
  if (e.target.dataset.aiTenantKeyInput !== undefined) { AI_TENANT_FORM.newKey = e.target.value; }
});

document.addEventListener("change", e => {
  if (e.target.dataset.aiModelSelect) {
    AI_PROVIDER_FORMS[e.target.dataset.aiModelSelect].model = e.target.value;
    render();
  }
  if (e.target.dataset.aiTenantProvider !== undefined) {
    AI_TENANT_FORM.provider = e.target.value;
    AI_TENANT_FORM.model = AI_MODEL_CATALOG[e.target.value][0];
    AI_TENANT_FORM.customModel = "";
    render();
  }
  if (e.target.dataset.aiTenantModel !== undefined) {
    AI_TENANT_FORM.model = e.target.value;
    render();
  }
  if (e.target.dataset.aiTenantKeyMode !== undefined) {
    AI_TENANT_FORM.useCustomKey = e.target.dataset.aiTenantKeyMode === "custom";
    render();
  }
});

document.addEventListener("submit", e => {
  if (e.target.id === "loginForm") submitLogin(e);
});

async function checkAuth() {
  try {
    const res = await fetch("/api/auth/me");
    if (res.ok) { AUTH.email = (await res.json()).email; return true; }
  } catch (e) {}
  AUTH.email = null;
  return false;
}

async function logout() {
  try { await fetch("/api/auth/logout", { method: "POST" }); } catch (e) {}
  AUTH.email = null;
  USERS = [];
  OVERVIEW = { userCount: 0, connectionCount: 0, reportCount: 0, connectionsByStatus: {}, slackConnectedCount: 0, failingConnectionCount: 0 };
  EVENTS = [];
  USER_DETAIL = null;
  SLACK_TENANTS = [];
  SESSIONS = [];
  SESSIONS_SCANNED = 0;
  TOTAL_SESSIONS = 0;
  SESSION_DETAIL = null;
  CONNECTIONS = [];
  GOALS = []; GOALS_TOTAL = 0;
  TAGS = []; TAGS_TOTAL = 0;
  AI_PROVIDERS_DATA = null;
  AI_PROVIDER_FORMS = null;
  AI_TENANT_FORM = null;
  state.view = "overview";
  loginState.email = "";
  loginState.password = "";
  render();
}

async function init() {
  document.documentElement.setAttribute("data-theme", getTheme());
  const authed = await checkAuth();
  if (authed) { await loadOverview(); await loadUsers(); }
  render();
}
init();
</script>
