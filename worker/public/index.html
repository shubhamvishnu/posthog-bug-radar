<meta charset="utf-8">
<title>Bug Radar · dreamteam</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.006em;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;letter-spacing:inherit}
input,textarea,select{font-family:inherit;letter-spacing:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{opacity:.82}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

:root{
--bg:#ffffff;--bg-sub:#f7f6f4;--bg-elev:#ffffff;--bg-side:#fafaf8;--bg-hover:#f3f2ef;--bg-active:#eeece8;
--border:#eceae5;--border-soft:#f1efeb;--border-str:#ddd9d2;--scroll:#d9d6cf;
--text:#1a1712;--muted:#6b6860;--faint:#9c988e;
--accent:#e5482b;--accent-fg:#ffffff;
--sev-high:#e0442e;--sev-med:#bd7a17;--sev-low:#3e8f66;--sev-none:#a5a199;
--oc-done:#2f9e6b;--oc-block:#e0442e;--oc-aband:#c07a1e;--oc-unres:#9a968e;
--ev-dead:#bd7a17;--ev-rage:#e0442e;--ev-exc:#8b52d6;--ev-nav:#b4b0a7;
--home-grad:linear-gradient(180deg,rgba(255,255,255,0) 0,#ffffff 130px),linear-gradient(96deg,#d5e6ff 0%,#ffe6d5 47%,#ffe1ce 60%,#d9f2e7 100%);
--panel-grad:linear-gradient(150deg,#d5e6ff 0%,#ffe6d5 46%,#ffe1ce 62%,#d9f2e7 100%);
--shadow:0 1px 2px rgba(20,16,10,.05),0 6px 18px rgba(20,16,10,.045);
--icon-tile:#181510;--icon-fg:#ffffff;
}
html[data-theme="dark"]{
--bg:#0c0d10;--bg-sub:#101116;--bg-elev:#15161b;--bg-side:#0a0b0d;--bg-hover:#16181d;--bg-active:#1b1d23;
--border:#212228;--border-soft:#1a1b20;--border-str:#2d2f37;--scroll:#2a2c33;
--text:#eef0f3;--muted:#989ca4;--faint:#63676f;
--accent:#ff6a48;--accent-fg:#0c0d10;
--sev-high:#ff5c52;--sev-med:#e0a13c;--sev-low:#43c98c;--sev-none:#6b6f78;
--oc-done:#3fce8f;--oc-block:#ff5c52;--oc-aband:#e0a13c;--oc-unres:#6b6f78;
--ev-dead:#e0a13c;--ev-rage:#ff5c52;--ev-exc:#b388ff;--ev-nav:#484b53;
--home-grad:linear-gradient(180deg,rgba(12,13,16,0) 0,#0c0d10 130px),linear-gradient(96deg,#12233b 0%,#2a1a12 50%,#122a20 100%);
--panel-grad:linear-gradient(150deg,#12233b 0%,#2a1a12 50%,#122a20 100%);
--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.3);
--icon-tile:#20222a;--icon-fg:#ffffff;
}
@keyframes fade-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes menu-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes ring{to{transform:rotate(360deg)}}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.35}}

/* ---- app shell ---- */
.app{display:flex;height:100vh}
.sidebar{width:232px;flex:none;background:var(--bg-side);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;transition:width .16s ease;overflow:hidden}
.sidebar.collapsed{width:58px}
.ws-row{display:flex;align-items:center;gap:6px;padding:14px 12px 12px;justify-content:space-between}
.sidebar.collapsed .ws-row{flex-direction:column;padding:14px 0 12px;gap:10px;justify-content:center}
.ws-btn{display:flex;align-items:center;gap:9px;min-width:0;flex:1;text-align:left}
.sidebar.collapsed .ws-btn{flex:none}
.logo-tile{width:26px;height:26px;flex:none;border-radius:7px;background:var(--icon-tile);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.ws-name{font-weight:600;font-size:14px}
.sidebar.collapsed .lbl{display:none}
.collapse-btn{display:grid;place-items:center;width:26px;height:26px;flex:none;border-radius:6px;color:var(--faint)}
.collapse-btn:hover{background:var(--bg-hover)}
.side-nav{padding:6px 8px;display:flex;flex-direction:column;gap:1px}
.sidebar.collapsed .side-nav{padding:6px 0}
.nav-item{display:flex;align-items:center;gap:9px;height:31px;padding:0 9px;border-radius:7px;font-size:13px;font-weight:450;text-align:left;color:var(--muted)}
.sidebar.collapsed .nav-item{padding:0;justify-content:center}
.nav-item svg{flex:none}
.nav-item.active{color:var(--text);background:var(--bg-active);font-weight:550}
.nav-item:hover:not(.active){background:var(--bg-hover)}
.side-bottom{margin-top:auto;padding:10px 8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.sidebar.collapsed .side-bottom{padding:10px 0}
.theme-wrap{display:flex;background:var(--bg-sub);border:1px solid var(--border);border-radius:9px;padding:3px}
.sidebar.collapsed .theme-wrap{flex-direction:column;align-items:center;gap:4px;background:transparent;border:none;padding:0}
.theme-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;border-radius:7px;font-size:12px;font-weight:500;color:var(--muted)}
.theme-btn.active{color:var(--text);background:var(--bg-elev);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.sidebar.collapsed .theme-btn{width:32px;height:32px;flex:none;border:1px solid var(--border)}
.sidebar.collapsed .theme-btn.active{background:var(--bg-active)}
.user-row{display:flex;align-items:center;gap:9px;padding:4px;width:100%;text-align:left;border-radius:8px}
.user-row:hover{background:var(--bg-hover)}
.user-row .user-meta{min-width:0;overflow:hidden}
.user-row .user-name,.user-row .user-role{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sidebar.collapsed .user-row{justify-content:center;padding:2px 0}
.profile-menu{position:fixed;top:0;left:0;width:236px;background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;z-index:200;animation:menu-in .14s ease}
.profile-menu-header{display:flex;align-items:center;gap:9px;padding:8px 8px 10px}
.profile-menu-id{min-width:0;overflow:hidden}
.profile-menu-name{display:block;font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-menu-email{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-menu-sep{height:1px;background:var(--border);margin:2px 4px}
.profile-menu-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px;border-radius:8px;font-size:13px;color:var(--text);text-align:left}
.profile-menu-item:hover{background:var(--bg-hover)}
.profile-menu-item.danger{color:var(--sev-high)}
.avatar{width:26px;height:26px;flex:none;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:11px}
.avatar.lg{width:48px;height:48px;font-size:17px}
.avatar.md{width:28px;height:28px;font-size:11px}
.user-meta{min-width:0}
.user-name{display:block;font-weight:500;font-size:12.5px;line-height:1.15}
.user-role{display:block;color:var(--faint);font-size:10.5px}

.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
.pageheader{height:44px;flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 20px}
.pageheader .crumb{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:5px}
.pageheader .crumb:hover{color:var(--text)}
.pageheader .sep{color:var(--faint)}
.pageheader .title{font-weight:600;font-size:13.5px}
.pageheader .idmono{font-family:'JetBrains Mono',monospace;color:var(--text);font-size:12.5px}
.pageheader .count{color:var(--faint);font-family:'JetBrains Mono',monospace;font-size:12px}
.content{flex:1;min-height:0;overflow:auto}
.contentpad{padding:26px 30px 70px;max-width:900px}

/* ---- home ---- */
.home-bg{background:var(--home-grad);height:100%;overflow:auto}
.home-wrap{max-width:1060px;margin:0 auto;padding:34px 40px 70px}
.home-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:22px}
.home-date{color:var(--muted);font-size:13px;font-weight:450;margin-bottom:7px}
.home-h1{font-size:27px;line-height:1.15;font-weight:700;letter-spacing:-.025em;margin:0}
.home-right{display:flex;align-items:center;gap:10px;flex:none;padding-top:20px}
.home-lastrun{color:var(--muted);font-size:12.5px;font-style:italic}
.icon-btn-square{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--bg-elev);display:grid;place-items:center;box-shadow:var(--shadow)}
.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:34px}
.insight-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:13px;padding:15px 17px;box-shadow:var(--shadow);display:flex;gap:13px;align-items:center}
.insight-icon{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center}
.insight-eyebrow{font-size:12.5px;margin-bottom:2px}
.insight-body{font-size:14px;line-height:1.45;color:var(--muted);min-width:0}
.section-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.section-title{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0}
.section-count{font-size:12px;color:var(--faint);font-family:'JetBrains Mono',monospace}
.feed-row{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 14px;border-bottom:1px solid var(--border-soft);text-align:left}
.feed-row:hover{background:var(--bg-hover)}
.feed-row.top{box-shadow:inset 3px 0 0 var(--accent);background:var(--bg-sub)}
.feed-tile{width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center}
.feed-type{flex:none;font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;white-space:nowrap}
.feed-bug-icon{flex:none;display:grid;place-items:center;width:16px}
.feed-title{flex:1;min-width:0;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.feed-rel{flex:none;font-size:12px;font-family:'JetBrains Mono',monospace;text-align:right;color:var(--faint);white-space:nowrap}
.feed-sev{flex:none;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.patterns-head{margin:36px 0 12px}
.patterns-head h2{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0 0 2px}
.patterns-head p{margin:0;color:var(--muted);font-size:13px}
.macro-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.macro-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
.macro-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.macro-dot{width:7px;height:7px;border-radius:50%;flex:none}
.macro-conf{font-size:11.5px;font-weight:600}
.macro-ratio{margin-left:auto;font-size:11px;color:var(--faint);font-family:'JetBrains Mono',monospace}
.macro-title{font-weight:600;font-size:14.5px;letter-spacing:-.01em;margin-bottom:5px}
.macro-cause{font-size:13px;line-height:1.5;color:var(--muted)}
.empty-note{color:var(--muted);font-size:13px;padding:20px 14px}

/* ---- people / sessions list rows ---- */
.list-subhead{display:flex;align-items:center;height:34px;padding:0 20px;background:var(--bg-sub);border-bottom:1px solid var(--border);font-size:11px;letter-spacing:.02em;color:var(--faint);font-weight:500;gap:8px}
.list-row{display:flex;align-items:center;width:100%;height:42px;padding:0 20px;border-bottom:1px solid var(--border-soft);text-align:left;gap:10px}
.list-row:hover{background:var(--bg-hover)}
.col-user{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.col-user .nm{font-weight:500;font-size:13px;white-space:nowrap}
.col-user .meta{font-size:12px;color:var(--faint);font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-sess{width:110px;font-size:13px;color:var(--muted)}
.w-sev{width:130px;display:flex;align-items:center;gap:7px}
.w-sev span.lbl2{font-size:12.5px;color:var(--muted)}
.w-bugs{width:90px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted)}
.w-last{width:80px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint)}

/* ---- people detail ---- */
.pd-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.pd-name{font-size:19px;font-weight:600;letter-spacing:-.02em}
.pd-meta{color:var(--faint);font-size:12.5px;font-family:'JetBrains Mono',monospace}
.stat-strip{display:flex;gap:10px;margin-bottom:26px;flex-wrap:wrap}
.stat-box{border:1px solid var(--border);background:var(--bg-sub);border-radius:10px;padding:10px 14px;min-width:110px}
.stat-box .l{font-size:11px;color:var(--faint);font-weight:500;margin-bottom:3px}
.stat-box .v{font-size:19px;font-weight:600;font-family:'JetBrains Mono',monospace}
.section-label{font-size:11.5px;color:var(--faint);font-weight:600;letter-spacing:.02em;margin-bottom:8px}
.mini-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;height:42px;padding:0 14px;border:1px solid var(--border);background:var(--bg-elev);border-radius:10px;margin-bottom:7px}
.mini-row:hover{border-color:var(--border-str);background:var(--bg-hover)}
.mini-row .idm{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint)}
.mini-row .ttl{flex:1;min-width:0;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-dots{display:flex;gap:4px;flex:none}
.mini-dots span{width:8px;height:8px;border-radius:50%}

/* ---- sessions table ---- */
.sess-toolbar{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:10px}
.search-box{display:flex;align-items:center;gap:6px;background:var(--bg-sub);border:1px solid var(--border);border-radius:7px;padding:4px 9px;width:210px}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:12.5px}
.sev-tabs{display:flex;gap:1px;background:var(--bg-sub);border:1px solid var(--border);border-radius:7px;padding:2px}
.sev-tab{padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--muted)}
.sev-tab.active{color:var(--text);background:var(--bg-elev);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.sess-row{display:flex;align-items:center;gap:10px;width:100%;height:42px;padding:0 20px;border-bottom:1px solid var(--border-soft);text-align:left}
.sess-row:hover{background:var(--bg-hover)}
.sess-id{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--faint);flex:none;width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-dot{width:6px;height:6px;flex:none;border-radius:50%;background:var(--accent)}
.sess-title{flex:1;min-width:0;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-more{flex:none;font-size:11.5px;color:var(--faint)}
.sess-dots{width:96px;display:flex;gap:4px;align-items:center;flex:none}
.sess-dots span{width:8px;height:8px;border-radius:50%}
.sess-ratio{width:52px;flex:none;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted)}
.sess-counts{width:120px;flex:none;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--faint)}
.sess-rel{width:46px;flex:none;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--faint)}

/* ---- session detail ---- */
.btn-outline{display:flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--border-str);border-radius:8px;font-size:12.5px;font-weight:500;color:var(--text)}
.btn-outline:hover{background:var(--bg-hover)}
.btn-primary{padding:8px 15px;background:var(--accent);color:var(--accent-fg);border-radius:8px;font-weight:600;font-size:13px}
.btn-primary:hover{opacity:.9}
.btn-secondary{padding:8px 15px;border:1px solid var(--border-str);border-radius:8px;font-weight:500;font-size:13px;color:var(--text)}
.btn-secondary:hover{background:var(--bg-hover)}

.sd-page{padding:26px 32px 80px;max-width:1060px}
.sd-layout{display:flex;gap:28px}
.sd-main{flex:1;min-width:0}
.sd-eyebrow{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.05em;margin-bottom:8px}
.sd-h1{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px;line-height:1.25}
.sd-subline{font-size:13px;color:var(--muted);margin-bottom:22px}

.outreach-box{border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);border-radius:11px;margin-bottom:20px;overflow:hidden}
.outreach-header{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 14px;text-align:left}
.outreach-header:hover{background:var(--bg-hover)}
.outreach-icon-tile{width:34px;height:34px;flex:none;border-radius:9px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);display:grid;place-items:center}
.outreach-tag{flex:none;font-size:11px;font-weight:500;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 8px;border-radius:6px;white-space:nowrap}
.outreach-header-title{flex:1;min-width:0;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outreach-chev{flex:none;transition:transform .15s ease}
.outreach-chev.open{transform:rotate(90deg)}
.outreach-panel{border-top:1px solid var(--border);background:var(--bg-sub);padding:13px 15px;animation:fade-up .16s ease}
.outreach-to-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:10px}
.outreach-draft{width:100%;min-height:112px;resize:vertical;background:var(--bg-elev);border:1px solid var(--border-str);border-radius:9px;padding:11px 13px;font-size:13.5px;line-height:1.55;color:var(--text);outline:none}
.outreach-draft:focus{border-color:var(--accent)}
.outreach-actions{display:flex;align-items:center;gap:8px;margin-top:10px}
.outreach-send{display:flex;align-items:center;gap:6px;padding:7px 13px;background:var(--accent);color:var(--accent-fg);border-radius:8px;font-weight:600;font-size:12.5px}
.outreach-send:hover{opacity:.9}
.outreach-discard{padding:7px 12px;border:1px solid var(--border-str);border-radius:8px;font-size:12.5px;font-weight:500;color:var(--text)}
.outreach-discard:hover{background:var(--bg-hover)}
.no-outreach{border:1px dashed var(--border-str);border-radius:12px;padding:13px 16px;margin-bottom:24px;display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}

.tasks-head-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tasks-head-row .lbl{font-size:11.5px;color:var(--faint);font-weight:600;letter-spacing:.03em}
.tasks-head-row .cnt{font-size:11.5px;color:var(--faint);font-family:'JetBrains Mono',monospace}
.tasks-head-rule{flex:1;height:1px;background:var(--border)}

.task-card{border:1px solid var(--border);background:var(--bg-elev);border-radius:11px;margin-bottom:8px;overflow:hidden}
.task-header{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0 14px;text-align:left}
.task-header:hover{background:var(--bg-hover)}
.task-tile{width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center}
.task-bug-icon{flex:none;display:grid;place-items:center;width:16px}
.task-header-title{flex:1;min-width:44px;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-header-sev{flex:none;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.task-chev{flex:none;transition:transform .15s ease}
.task-chev.open{transform:rotate(90deg)}
.task-panel{border-top:1px solid var(--border);padding:14px 16px 15px;animation:fade-up .16s ease}

.correct-form{border-top:1px solid var(--border);background:var(--bg-sub);padding:15px 17px;animation:fade-up .16s ease}

.correct-note-row{display:flex;gap:8px;align-items:center;margin:9px 0 0 90px;animation:fade-up .14s ease}

.change-hint{margin-left:auto;font-size:11.5px;color:var(--faint)}

.sd-rail{width:250px;flex:none;position:sticky;top:0;align-self:flex-start;display:flex;flex-direction:column;gap:14px}

.rail-panel{border:1px solid var(--border);border-radius:11px;overflow:hidden}
.rail-panel-head{padding:8px 13px;font-size:10.5px;color:var(--faint);font-weight:600;letter-spacing:.04em;background:var(--bg-sub);border-bottom:1px solid var(--border)}
.rail-row{display:flex;align-items:center;gap:10px;padding:9px 13px;font-size:12.5px;border-top:1px solid var(--border-soft)}

.sd-tabs{display:flex;gap:4px;margin-top:28px;border-bottom:1px solid var(--border)}

.evidence-card{border:1px solid var(--border);border-radius:11px;padding:13px 15px;margin-bottom:9px;font-size:12.5px;line-height:1.55}

.timeline-wrap{position:relative;padding-left:20px;margin-top:24px}

/* ---- settings ---- */

.settings-tabs{display:inline-flex;gap:2px;background:var(--bg-sub);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:26px}

.conn-source-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid var(--border);border-radius:12px;margin-bottom:22px}
.conn-card{border:1px solid var(--border);border-radius:14px;overflow:hidden}
.conn-card-head{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:14px}
.conn-identity{padding:18px 22px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--accent) 5%,transparent)}
.conn-quick{padding:18px 22px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:repeat(2,1fr);gap:12px 22px}

.know-card{border:1px solid var(--border);border-radius:14px;padding:22px;max-width:620px}

.login-main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}

.login-tabs{display:inline-flex;align-items:center;gap:3px;background:var(--bg-sub);border:1px solid var(--border);border-radius:9px;padding:3px;width:max-content;margin-bottom:22px}

.sso-stack{display:flex;flex-direction:column;gap:10px;margin-top:26px}

.login-divider{display:flex;align-items:center;gap:12px;margin:22px 0}

.login-label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:7px}

    fetch("/api/report"),
    fetch("/api/prompts"),
    fetch("/api/corrections"),
    fetch("/api/connections"),
    fetch("/api/company-knowledge"),
    fetch("/api/goals"),
    fetch("/api/tags"),

      session_id: c.session_id, task_index: c.task_index, task_title: c.task_title,
      task_goal: c.task_goal, field: c.field, from: c.from_value, to: c.to_value,
      reason: c.reason, timestamp: c.created_at,
    }));

    outreach: !!f.recommended_outreach,
    min: minutesAgo(f.started_at),

function groupByPerson() {

function positionProfileMenu() {
  const trigger = document.getElementById("profileMenuTrigger");
  const portal = document.getElementById("profileMenuPortal");
  const menuEl = portal && portal.firstElementChild;
  if (!trigger || !menuEl) return;
  const r = trigger.getBoundingClientRect();
  const gap = 10;
  const menuW = menuEl.offsetWidth;
  const menuH = menuEl.offsetHeight;
  let left = r.right + gap;
  if (left + menuW > window.innerWidth - 8) left = r.left - menuW - gap;
  let top = r.top;
  if (top + menuH > window.innerHeight - 8) top = window.innerHeight - menuH - 8;
  if (top < 8) top = 8;
  menuEl.style.left = Math.round(left) + "px";
  menuEl.style.top = Math.round(top) + "px";
}

function syncProfileMenu() {
  let portal = document.getElementById("profileMenuPortal");
  if (!state.profileMenuOpen) {
    if (portal) portal.remove();
    return;
  }
  if (!portal) {
    portal = document.createElement("div");
    portal.id = "profileMenuPortal";
    document.body.appendChild(portal);
  }
  portal.innerHTML = renderProfileMenu();
  positionProfileMenu();
}

/* ---------------- home ---------------- */
function buildFeed() {
  const all = [];
  REPORT.micro_findings.forEach(f => (f.tasks || []).forEach((t, ti) => all.push({ f, t, ti })));
  const isOutreach = (f, ti) => f.recommended_outreach && f.recommended_outreach.task_index === ti;
  let cands = all.filter(x => isOutreach(x.f, x.ti) || sevOf(x.t) === "high" || (sevOf(x.t) === "medium" && x.t.real_bug));
  cands.sort((a, b) => {
    const ao = isOutreach(a.f, a.ti) ? 1 : 0, bo = isOutreach(b.f, b.ti) ? 1 : 0;
    if (ao !== bo) return bo - ao;
    if (SEV_RANK[sevOf(b.t)] !== SEV_RANK[sevOf(a.t)]) return SEV_RANK[sevOf(b.t)] - SEV_RANK[sevOf(a.t)];
    return (minutesAgo(a.f.started_at) ?? 0) - (minutesAgo(b.f.started_at) ?? 0);
  });
  return cands.slice(0, 8).map(x => ({ ...x, out: isOutreach(x.f, x.ti) }));
}

/* ---------------- session detail ---------------- */
function taskDeepLink(f, task) {
  const events = f.events || [];
  if (!events.length || !task.key_timestamp) return null;
  const start = new Date(events[0].timestamp).getTime();
  let match = events.find(e => e.timestamp === task.key_timestamp);
  if (!match) {
    const target = new Date(task.key_timestamp).getTime();
    if (isNaN(target)) return null;
    match = events.reduce((best, e) => {
      const d = Math.abs(new Date(e.timestamp).getTime() - target);
      return d < best.d ? { e, d } : best;
    }, { e: null, d: Infinity }).e;
  }
  if (!match) return null;
  const offsetSec = Math.max(0, Math.floor((new Date(match.timestamp).getTime() - start) / 1000));
  return `${f.replay_url}?t=${offsetSec}`;
}

        <button class="correct-save" data-act="save-correction" style="${canSave ? "" : "opacity:.4;pointer-events:none"}">Save correction</button>
        <button class="correct-cancel" data-act="toggle-correct" data-task="${ti}">Cancel</button>

      </div>
    </div>
  </div>`;
}

function sessionTabDefs(f) {
  const tabs = [{ key: "events", label: "Raw Event Timeline", icon: "" }];
  if (f.ai_summary) tabs.push({ key: "ai_summary", label: "AI Summary", icon: ICON_SPARKLE });
  if (f.vision_observations && f.vision_observations.length) tabs.push({ key: "vision", label: "Vision", icon: ICON_SCAN });
  if (f.error_issues && f.error_issues.length) tabs.push({ key: "errors", label: "Error Tracking", icon: ICON_BUG });
  if (f.console_evidence && f.console_evidence.length) tabs.push({ key: "console", label: "Console / Network", icon: ICON_TERMINAL });
  return tabs;
}

function renderSessionTabStrip(f) {
  const tabs = sessionTabDefs(f);
  if (tabs.length <= 1) return "";
  const active = tabs.some(t => t.key === state.sessionTab) ? state.sessionTab : "events";
  return `<div class="sd-tabs">${tabs.map(t => `<button class="sd-tab-btn${t.key === active ? " active" : ""}" data-act="session-tab" data-tab="${t.key}">${t.icon}${escapeHtml(t.label)}</button>`).join("")}</div>`;
}

function renderAiSummaryTab(f) {
  return `<div class="evidence-card"><div style="font-weight:600;margin-bottom:6px">PostHog Session Summary</div>${escapeHtml(f.ai_summary)}</div>`;
}
function renderVisionTab(f) {
  return f.vision_observations.map(o => `<div class="evidence-card"><div style="font-weight:600;margin-bottom:4px">${escapeHtml(o.title || "Observation")}</div>${escapeHtml(o.description || "")}</div>`).join("");
}
function renderErrorsTab(f) {
  return f.error_issues.map(i => `<div class="evidence-card"><div style="font-weight:600;margin-bottom:4px">${escapeHtml(i.name || i.title || "Issue")}</div><pre style="margin:6px 0 0;font-family:'JetBrains Mono',monospace;font-size:11.5px;white-space:pre-wrap;color:var(--muted)">${escapeHtml(i.stack || i.description || "")}</pre></div>`).join("");
}
function renderConsoleTab(f) {
  return f.console_evidence.map(c => `<div class="evidence-card"><span style="font-family:'JetBrains Mono',monospace;color:${c.level === "error" ? "var(--sev-high)" : "var(--muted)"}">${escapeHtml(c.text || "")}</span></div>`).join("");
}

function renderCapturedMoments(f, ti, t) {
  const media = t.media || [];
  if (!media.length) return "";
  const key = `${f.session_id}:${ti}`;
  const shown = !!state.expandedMedia[key];
  const grid = media.map((m, mi) => `
    <div class="moment-tile">
      ${m.url ? `<img src="${escapeHtml(m.url)}" alt="Captured moment" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="this.outerHTML='<div class=&quot;moment-ph&quot;></div>'"/>` : `<div class="moment-ph"></div>`}
      <div class="moment-fade"></div>
      <span class="moment-ts">${escapeHtml(m.ts || "")}</span>
      ${m.isVid ? `<span class="moment-dur">${escapeHtml(m.dur || "")}</span><button class="moment-play" data-act="moment-open" data-task="${ti}" data-media="${mi}" title="Play clip">${ICON_PLAY_FILL}</button>` : ""}
    </div>`).join("");
  return `
  <div style="margin-top:13px">
    <button class="moment-toggle" data-act="toggle-media" data-key="${escapeHtml(key)}"><span style="display:inline-flex;transition:transform .15s ease;${shown ? "transform:rotate(90deg)" : ""}">${ICON_CHEVRON(11)}</span>${ICON_CAMERA}CAPTURED MOMENTS<span style="color:var(--faint);font-family:'JetBrains Mono',monospace">${media.length}</span></button>
    ${shown ? `<div class="moment-grid">${grid}</div>` : ""}
  </div>`;
}

function taskTagPickerToggle(key) {
  state.taskTagPicker = state.taskTagPicker === key ? null : key;

}

async function taskTagAdd(sessionId, taskIndex, tagId) {
  state.taskTagPicker = null;
  const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/tasks/${taskIndex}/tags`, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ tag_id: tagId }),
  });
  if (res.ok) { await loadData(); render(); }
  else flash("Could not add tag");
}

async function taskTagRemove(sessionId, taskIndex, tagId) {
  const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/tasks/${taskIndex}/tags/${tagId}`, { method: "DELETE" });
  if (res.ok) { await loadData(); render(); }
  else flash("Could not remove tag");
}

function tagChipHtml(tagId, onRemove) {
  const def = TAGS.find(x => x.id === tagId);

  const label = def ? def.label : "Unknown";
  return `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;line-height:1;padding:4px 8px;border-radius:20px;color:${escapeHtml(color)};background:color-mix(in srgb,${escapeHtml(color)} 13%,transparent);border:1px solid color-mix(in srgb,${escapeHtml(color)} 28%,transparent)">${escapeHtml(label)}${onRemove ? `<button data-act="task-tag-remove" data-session="${escapeHtml(onRemove.sessionId)}" data-task="${onRemove.taskIndex}" data-tagid="${tagId}" title="Remove tag" style="display:grid;place-items:center;width:13px;height:13px;margin:-1px -3px -1px 0;border-radius:50%;color:currentColor;opacity:.6">${ICON_X_TINY}</button>` : ""}</span>`;
}

function renderSessionTagsRail(f) {
  const byTag = new Map(); // tag_id -> { count, anyUser }
  (f.tasks || []).forEach(t => (t.tags || []).forEach(tg => {
    const entry = byTag.get(tg.tag_id) || { count: 0, anyUser: false };
    entry.count++;
    if (tg.assign === "user") entry.anyUser = true;
    byTag.set(tg.tag_id, entry);
  }));
  const chipsHtml = Array.from(byTag.entries()).map(([tagId, entry]) => {
    const def = TAGS.find(x => x.id === tagId);
    const color = def ? def.color : "#64748b";
    const label = def ? def.label : "Unknown";
    const countLabel = entry.count > 1 ? ` <span style="opacity:.7">${entry.count}</span>` : "";
    return `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;line-height:1;padding:4px 8px;border-radius:20px;color:${escapeHtml(color)};background:color-mix(in srgb,${escapeHtml(color)} 13%,transparent);border:1px solid color-mix(in srgb,${escapeHtml(color)} 28%,transparent)">${escapeHtml(label)}${countLabel}</span>`;

/* ---------------- settings: connections ---------------- */
const POSTHOG_MARK = `<span class="conn-empty-icon"><span style="width:5px;height:9px;border-radius:2px;background:#F9BD2B"></span><span style="width:5px;height:15px;border-radius:2px;background:#1D4AFF"></span><span style="width:5px;height:12px;border-radius:2px;background:#F54E00"></span></span>`;
const CONN_STEPS = [
  "Validating key",
  "Resolving project",
  "Using selected project",
  "Pulling project settings",
  "Discovering events",
  "Discovering person properties",
  "Agent mapping identity + conventions",
];
const CHIP_STATE = { active: ["var(--oc-done)", "Active"], idle: ["var(--sev-med)", "Unused"], off: ["var(--faint)", "Off"], unknown: ["var(--faint)", "Unverified"] };

function connChipStyle(state) {
  const [c] = CHIP_STATE[state] || CHIP_STATE.unknown;
  return `background:color-mix(in srgb,${c} 14%,transparent);color:${c}`;
}
function connChipLabel(state) { return (CHIP_STATE[state] || CHIP_STATE.unknown)[1]; }

function connStart() { state.connFlow = "form"; state.connApiKey = ""; state.connError = null; render(); }
function connCancel() { state.connFlow = CONNECTIONS.length ? "connected" : "idle"; state.connError = null; render(); }

async function connRun() {
  if (!state.connApiKey.trim()) return;
  state.connFlow = "running"; state.connStep = 0; state.connError = null; render();
  try {
    const res = await fetch("/api/connections/resolve", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ api_key: state.connApiKey.trim() }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not validate this key.");
    state.connRegion = data.region;
    state.connStep = 2;
    if (data.projects.length === 1) {
      state.connProjectId = data.projects[0].id;
      state.connProjectName = data.projects[0].name;
      render();
      await runDiscovery();
    } else {
      state.connCandidates = data.projects;
      state.connFlow = "picking";
      render();
    }
  } catch (e) {
    state.connFlow = "form"; state.connError = e.message; render();
  }
}

async function pickProject(id, name) {
  state.connProjectId = id; state.connProjectName = name; state.connFlow = "running";
  render();
  await runDiscovery();
}

async function runDiscovery() {
  try {
    const res = await fetch("/api/connections/discover", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ api_key: state.connApiKey.trim(), region: state.connRegion, project_id: state.connProjectId }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Discovery failed.");
    state.connStep = 7;
    state.connDraft = data;
    state.connFlow = "summary";
    render();
  } catch (e) {
    state.connFlow = "form"; state.connError = e.message; render();
  }
}

async function saveConnection() {
  const res = await fetch("/api/connections/save", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({
      api_key: state.connApiKey.trim(), region: state.connRegion, project_id: state.connProjectId,
      config_map: state.connDraft.configMap, identity: state.connDraft.identity,
    }),
  });
  const data = await res.json();
  if (!res.ok) { flash(data.error || "Could not save connection"); return; }
  state.connFlow = "connected"; state.connApiKey = ""; state.connDraft = null; state.identityEditing = false;
  await loadData();
  flash("PostHog connection saved");
  render();
}

async function resyncConnection(id) {
  flash("Re-syncing…");
  const res = await fetch(`/api/connections/${id}/resync`, { method: "POST" });
  const data = await res.json();
  if (!res.ok) { flash(data.error || "Re-sync failed"); return; }
  await loadData();
  flash("Re-synced — config refreshed");
  render();
}

function toggleConnGroup(name) { state.expandedGroups[name] = !state.expandedGroups[name]; render(); }
function identityToggle() { state.identityEditing = !state.identityEditing; render(); }

function syncedLabel(iso) {
  if (!iso) return "just now";
  const m = Math.round((Date.now() - new Date(iso + "Z").getTime()) / 60000);
  if (m < 1) return "just now";
  return m < 60 ? `${m}m ago` : `${Math.round(m / 60)}h ago`;
}

function renderConnChecklist() {
  const picking = state.connFlow === "picking";
  return CONN_STEPS.map((label, i) => {
    if (picking && i >= 2) return "";
    const isDone = i < state.connStep;
    const isRunning = state.connFlow === "running" && i === state.connStep;
    const dotClass = isDone ? "done" : isRunning ? "running" : "pending";
    const dot = isDone
      ? `<span class="conn-check-dot done">${ICON_CHECKMARK}</span>`
      : `<span class="conn-check-dot ${dotClass}"></span>`;
    return `<div class="conn-check-row" style="${isDone || isRunning ? "" : "opacity:.6"}">${dot}<span>${escapeHtml(label)}</span></div>`;
  }).join("");
}

        <button class="btn-outline" data-act="conn-cancel">Cancel</button>

  }
  if (state.connFlow === "running" || state.connFlow === "picking") {
    return `<div class="conn-running-card">
      <div style="font-weight:600;font-size:15px">Connecting to PostHog</div>
      <div style="font-size:12.5px;color:var(--muted);margin:5px 0 20px">Resolving your project — the agent inspects config, events, and identity as it goes.</div>

        </div>
      </div>` : ""}
    </div>`;

  if (state.connFlow === "summary" && state.connDraft) {
    return renderConnConfigCard(state.connDraft.configMap, state.connDraft.identity, { showSaveBar: true, identityEditable: true });
  }
  // connected
  const active = CONNECTIONS.find(c => c.id === state.activeConnId) || CONNECTIONS[0];
  const rowsHtml = CONNECTIONS.map(c => `
    <div class="conn-source-row">
      ${POSTHOG_MARK}

        <button class="btn-outline" data-act="conn-add-another">Add another</button>
      </div>
    </div>`).join("");
  const identity = active ? { email: active.identity_email_prop, name: active.identity_name_prop, role: active.identity_role_prop } : {};
  return `
    <div class="section-label">CONNECTED SOURCES</div>
    ${rowsHtml}
    ${active && active.config ? renderConnConfigCard(active.config, identity, { showSaveBar: false, identityEditable: true, conn: active }) : ""}
  `;
}

/* ---------------- settings: company knowledge ---------------- */
async function knowledgeFill() {
  if (state.knowledgeFilling || !state.knowledgeUrl.trim()) return;
  state.knowledgeFilling = true; render();
  try {
    const res = await fetch("/api/company-knowledge/autofill", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ domain: state.knowledgeUrl.trim() }),
    });
    const data = await res.json();
    if (res.ok) state.knowledgeDesc = data.description;
    else flash(data.error || "Could not draft a description");
  } catch (e) {
    flash("Could not draft a description");
  }
  state.knowledgeFilling = false; render();
}

async function saveKnowledge() {
  const res = await fetch("/api/company-knowledge", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ domain: state.knowledgeUrl.trim(), description: state.knowledgeDesc.trim() }),

  if (res.ok) flash("Company knowledge saved — analysis prompts updated");

}

/* ---------------- settings: goals ---------------- */
function goalToggleForm() {
  state.goalFormOpen = !state.goalFormOpen;
  state.goalPurpose = ""; state.goalDesc = ""; state.goalTags = "";
  render();
}

async function goalSave() {
  const purpose = state.goalPurpose.trim();
  if (!purpose) return;
  const tags = state.goalTags.split(",").map(t => t.trim()).filter(Boolean);
  const res = await fetch("/api/goals", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ purpose, description: state.goalDesc.trim(), tags }),
  });
  if (res.ok) {
    state.goalFormOpen = false; state.goalPurpose = ""; state.goalDesc = ""; state.goalTags = "";
    await loadData();
    flash("Goal added");
    render();
  } else {
    flash("Could not save goal");
  }
}

async function goalRemove(id) {
  const res = await fetch(`/api/goals/${id}`, { method: "DELETE" });
  if (res.ok) { await loadData(); render(); }
  else flash("Could not remove goal");
}

/* ---------------- actions ---------------- */
function withFocusPreserved(fn) {
  return (...args) => {
    const active = document.activeElement;
    const id = active && active.id;
    const selStart = active && "selectionStart" in active ? active.selectionStart : null;
    const selEnd = active && "selectionEnd" in active ? active.selectionEnd : null;
    fn(...args);
    render();
    if (id) {
      const el = document.getElementById(id);
      if (el) {
        el.focus();
        if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
      }
    }
  };
}

let toastTimer = null;
function flash(msg) {
  state.toast = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toast = null; render(); }, 2600);
}

function openSession(id, from) {
  state.route = "session-detail";
  state.selSession = id;
  state.backTo = from;
  state.correction = null;
  state.openTask = null;
  state.evidenceOpen = false;
  state.outreachOpen = false;
  state.draftText = null;
  state.sessionTab = "events";
  render();
}

function primaryTaskIndex(f) {
  if (f.recommended_outreach) return f.recommended_outreach.task_index;
  const tasks = f.tasks || [];
  let best = 0, bestRank = -1;
  tasks.forEach((t, i) => { const r = SEV_RANK[sevOf(t)]; if (r > bestRank) { bestRank = r; best = i; } });
  return best;
}

function toggleCorrection(f, ti, t) {
  const c = state.correction;
  if (c && c.session_id === f.session_id && c.task_index === ti) { state.correction = null; render(); return; }
  state.correction = {
    session_id: f.session_id, task_index: ti,
    values: { outcome: ocOf(t), severity: sevOf(t), real_bug: t.real_bug ? "true" : "false", customer_reachable: t.customer_reachable ? "true" : "false" },
    notes: {},
  };
  render();
}

async function saveCorrection() {
  const c = state.correction;
  if (!c) return;
  const f = REPORT.micro_findings.find(x => x.session_id === c.session_id);
  const t = f.tasks[c.task_index];
  const notes = c.notes || {};
  const changed = Object.keys(c.values).filter(k => c.values[k] !== origVal(t, k));
  if (!changed.length) return;
  if (!changed.every(k => notes[k] && notes[k].trim())) return;
  for (const field of changed) {
    const reason = notes[field].trim();
    const record = { session_id: f.session_id, task_index: c.task_index, task_title: t.title, task_goal: t.goal, field, from: origVal(t, field), to: c.values[field], reason };
    const res = await fetch("/api/corrections", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(record) });
    if (!res.ok) { flash("Saving the correction failed. Try again."); return; }
    record.timestamp = new Date().toISOString();
    CORRECTIONS.unshift(record);
  }
  changed.forEach(field => {
    if (field === "real_bug") t.real_bug = c.values.real_bug === "true";
    else if (field === "customer_reachable") t.customer_reachable = c.values.customer_reachable === "true";
    else t[field] = c.values[field];
  });
  state.correction = null;
  flash(changed.length + " correction" + (changed.length > 1 ? "s" : "") + " saved");
  render();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "nav") { state.route = el.dataset.route; if (el.dataset.route === "sessions") state.backTo = "sessions"; render(); }
  else if (act === "toggle-collapse") { state.collapsed = !state.collapsed; localStorage.setItem("br_collapsed", state.collapsed ? "1" : "0"); render(); }
  else if (act === "set-theme") { setTheme(el.dataset.theme); }
  else if (act === "open-session") { openSession(el.dataset.id, el.dataset.from); }
  else if (act === "open-person") { state.route = "people-detail"; state.selPersonKey = el.dataset.key; render(); }
  else if (act === "back-session") { state.route = state.backTo; render(); }
  else if (act === "sev-filter") { state.sevFilter = el.dataset.val; render(); }
  else if (act === "toggle-correct") {
    const f = REPORT.micro_findings.find(x => x.session_id === state.selSession);
    const ti = Number(el.dataset.task);
    toggleCorrection(f, ti, f.tasks[ti]);
  }
  else if (act === "corr-opt") {
    if (!state.correction) return;
    state.correction.values[el.dataset.field] = el.dataset.value;
    render();
  }
  else if (act === "save-correction") { saveCorrection(); }
  else if (act === "export-corrections") { window.open("/api/corrections", "_blank"); }
  else if (act === "task-toggle") {
    const f = REPORT.micro_findings.find(x => x.session_id === state.selSession);
    const ti = Number(el.dataset.task);
    const openIdx = state.openTask == null ? primaryTaskIndex(f) : state.openTask;
    state.openTask = openIdx === ti ? -1 : ti;
    state.evidenceOpen = false;
    render();
  }
  else if (act === "evidence-toggle") { state.evidenceOpen = !state.evidenceOpen; render(); }
  else if (act === "toggle-media") { const k = el.dataset.key; state.expandedMedia[k] = !state.expandedMedia[k]; render(); }
  else if (act === "moment-open") { flash("Playback isn't wired up yet, capture is UI-only for now."); }
  else if (act === "outreach-toggle") { state.outreachOpen = !state.outreachOpen; render(); }
  else if (act === "outreach-send") { state.outreachOpen = false; flash("Sending isn't wired to a channel yet, copy this message manually for now."); render(); }
  else if (act === "session-tab") { state.sessionTab = el.dataset.tab; render(); }
  else if (act === "settings-tab") { state.settingsTab = el.dataset.tab; render(); }
  else if (act === "conn-start") { connStart(); }
  else if (act === "conn-cancel") { connCancel(); }
  else if (act === "conn-run") { connRun(); }
  else if (act === "conn-pick") { pickProject(el.dataset.id, el.dataset.name); }
  else if (act === "conn-toggle-group") { toggleConnGroup(el.dataset.group); }
  else if (act === "identity-toggle") { identityToggle(); }
  else if (act === "identity-pick") {
    const prop = el.dataset.prop;
    if (state.connDraft) state.connDraft.identity.email = prop;
    else { const c = CONNECTIONS.find(x => x.id === state.activeConnId) || CONNECTIONS[0]; if (c) { c.identity_email_prop = prop; fetch(`/api/connections/${c.id}/identity`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: prop, name: c.identity_name_prop, role: c.identity_role_prop }) }); } }
    state.identityEditing = false;
    render();
  }
  else if (act === "sync-freq-pick") {
    const id = Number(el.dataset.id);
    const val = el.dataset.val;
    const c = CONNECTIONS.find(x => x.id === id);
    if (c) {
      c.sync_freq = val;
      fetch(`/api/connections/${id}/sync-settings`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ sync_freq: val, sync_max_sessions: c.sync_max_sessions || 8 }) });
      render();
    }
  }
  else if (act === "sync-max-pick") {
    const id = Number(el.dataset.id);
    const val = Number(el.dataset.val);
    const c = CONNECTIONS.find(x => x.id === id);
    if (c) {
      c.sync_max_sessions = val;
      fetch(`/api/connections/${id}/sync-settings`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ sync_freq: c.sync_freq || "1d", sync_max_sessions: val }) });
      render();
    }
  }
  else if (act === "conn-save") { saveConnection(); }
  else if (act === "conn-resync") { resyncConnection(Number(el.dataset.id)); }
  else if (act === "conn-add-another") { connStart(); }
  else if (act === "knowledge-fill") { knowledgeFill(); }
  else if (act === "knowledge-save") { saveKnowledge(); }
  else if (act === "goal-toggle-form") { goalToggleForm(); }
  else if (act === "goal-save") { goalSave(); }
  else if (act === "goal-remove") { goalRemove(Number(el.dataset.id)); }
  else if (act === "task-tag-picker-toggle") { taskTagPickerToggle(el.dataset.key); }
  else if (act === "task-tag-add") { taskTagAdd(el.dataset.session, Number(el.dataset.task), Number(el.dataset.tagid)); }
  else if (act === "task-tag-remove") { taskTagRemove(el.dataset.session, Number(el.dataset.task), Number(el.dataset.tagid)); }
});

const AUTH = { email: null };
const loginState = {
  mode: "signin", step: "email", email: "", emailError: "",
  sending: false, otp: ["", "", "", "", "", ""], otpError: "", verifying: false, resendIn: 0,
};
let resendTimer = null;

async function checkAuth() {
  try {
    const res = await fetch("/api/auth/me");
    if (res.ok) { AUTH.email = (await res.json()).email; return true; }
  } catch (e) {}
  AUTH.email = null;
  return false;
}

async function logout() {
  try { await fetch("/api/auth/logout", { method: "POST" }); } catch (e) {}
  AUTH.email = null;
  loginState.step = "email";
  loginState.mode = "signin";
  loginState.email = "";
  loginState.otp = ["", "", "", "", "", ""];
  REPORT = { generated_at: null, macro_themes: [], micro_findings: [] };
  render();
}

function otpResendRowHtml() {
  const s = loginState;
  return s.resendIn === 0
    ? `Didn't get it? <button data-act="otp-resend">Resend code</button>`
    : `Resend code in <span style="color:var(--text);font-weight:500">${s.resendIn}s</span>`;
}

function startResendTimer() {
  clearInterval(resendTimer);
  loginState.resendIn = 30;
  resendTimer = setInterval(() => {
    loginState.resendIn -= 1;
    if (loginState.resendIn <= 0) { clearInterval(resendTimer); loginState.resendIn = 0; }
    const row = document.getElementById("otpResendRow");
    if (row) row.innerHTML = otpResendRowHtml();
    else render();
  }, 1000);
}

function focusOtpBox(i) {
  requestAnimationFrame(() => {
    const el = document.getElementById("otp-" + i);
    if (el) { el.focus(); el.select && el.select(); }
  });
}

function onOtpInput(i, rawVal) {
  const val = (rawVal || "").replace(/\D/g, "");
  const otp = loginState.otp.slice();
  if (val.length > 1) {
    const chars = val.slice(0, 6).split("");
    for (let j = 0; j < 6; j++) otp[j] = chars[j] || "";
    loginState.otp = otp;
    loginState.otpError = "";
    render();
    focusOtpBox(Math.min(chars.length, 5));
    return;
  }
  otp[i] = val;
  loginState.otp = otp;
  loginState.otpError = "";
  render();
  if (val && i < 5) focusOtpBox(i + 1);
}

function onOtpKeydown(i, e) {
  if (e.key === "Backspace" && !loginState.otp[i] && i > 0) {
    e.preventDefault();
    focusOtpBox(i - 1);
  }
}

async function submitLoginEmail(e) {
  e.preventDefault();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(loginState.email)) {
    loginState.emailError = "Enter a valid email address.";
    render();
    return;
  }
  loginState.emailError = "";
  loginState.sending = true;
  render();
  try {
    const res = await fetch("/api/auth/request-otp", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ email: loginState.email }),
    });
    const data = await res.json().catch(() => ({}));
    loginState.sending = false;
    if (!res.ok) { loginState.emailError = data.error || "Something went wrong. Try again."; render(); return; }
    loginState.step = "otp";
    loginState.otp = ["", "", "", "", "", ""];
    loginState.otpError = "";
    render();
    startResendTimer();
    focusOtpBox(0);
  } catch (err) {
    loginState.sending = false;
    loginState.emailError = "Network error. Try again.";
    render();
  }
}

async function verifyLoginOtp() {
  const code = loginState.otp.join("");
  if (code.length < 6) return;
  loginState.verifying = true;
  render();
  try {
    const res = await fetch("/api/auth/verify-otp", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ email: loginState.email, code }),
    });
    const data = await res.json().catch(() => ({}));
    loginState.verifying = false;
    if (!res.ok) {
      loginState.otpError = data.error || "That code doesn't match.";
      loginState.otp = ["", "", "", "", "", ""];
      render();
      focusOtpBox(0);
      return;
    }
    clearInterval(resendTimer);
    loginState.step = "done";
    AUTH.email = data.email;
    render();
    setTimeout(async () => { await loadData(); render(); }, 1100);
  } catch (err) {
    loginState.verifying = false;
    loginState.otpError = "Network error. Try again.";
    render();
  }
}

function backToLoginEmail() {
  clearInterval(resendTimer);
  loginState.step = "email";
  loginState.otpError = "";
  render();
}

    <div class="login-subtitle">We sent a 6-digit code to <b style="color:var(--text);font-weight:500">${escapeHtml(s.email)}</b>.</div>
    <div class="otp-cells">
      ${s.otp.map((d, i) => `<input class="otp-cell${s.otpError ? " err" : (d ? " filled" : "")}" id="otp-${i}" data-otp-index="${i}" inputmode="numeric" maxlength="1" value="${escapeHtml(d)}"/>`).join("")}
    </div>
    ${s.otpError ? `<div class="login-error">${ICON_ALERT}${escapeHtml(s.otpError)}</div>` : ""}
    <button class="otp-verify-btn${complete ? "" : " disabled"}" data-act="otp-verify">
      ${s.verifying ? `<span class="spinner"></span>` : `<span>Verify &amp; continue</span>`}
    </button>
    <div class="otp-resend-row" id="otpResendRow">
      ${otpResendRowHtml()}
    </div>
  </div>`;
}

function renderLoginDoneStep(signup) {
  return `
  <div class="done-wrap">
    <div class="done-check">${ICON_BIG_CHECK}</div>
    <div class="login-title">${signup ? "Account created" : "You’re in"}</div>
    <div class="done-sub">Taking you to your radar…</div>
  </div>`;
}

function renderLoginShell() {
  const signup = loginState.mode === "signup";
  const theme = getTheme();
  return `
  <div class="login-shell">
    <aside class="login-panel">
      <div class="login-panel-wash"></div>
      <div class="login-panel-fade"></div>
      <div class="login-panel-inner">
        <div class="login-brand-row">
          <span class="login-brand-tile">${ICON_LOGO}</span>
          <span class="login-brand-name">Bug Radar</span>
        </div>
        <div class="login-pitch">
          <div class="login-pulse-chip"><span class="login-pulse-dot"></span>Watching dreamteam's PostHog for real friction</div>
          <h1 class="login-h1">The friction your users hit, surfaced before they churn.</h1>
          <p class="login-pitch-sub">Bug Radar reads real sessions, flags the dead clicks and rage taps that matter, and drafts the follow-up for you.</p>
          <div class="login-features">
            <div class="login-feature-row"><span class="login-feature-icon">${ICON_CLOCK}</span><span>Catch rage clicks the day they happen, not next quarter</span></div>
            <div class="login-feature-row"><span class="login-feature-icon">${ICON_DRAFT}</span><span>Auto-drafted outreach so no frustrated user goes unheard</span></div>
            <div class="login-feature-row"><span class="login-feature-icon">${ICON_SHIELD}</span><span>Human-in-the-loop corrections that sharpen every sweep</span></div>
          </div>
        </div>
        <div class="login-trust"><span>Events only</span><span style="opacity:.5">·</span><span>No session video read</span><span style="opacity:.5">·</span><span>Data stays in PostHog</span></div>
      </div>
    </aside>
    <main class="login-main">
      <div class="login-theme-toggle">
        <button class="login-theme-btn${theme === "light" ? " active" : ""}" data-act="set-theme" data-theme="light" title="Light">${ICON_SUN}</button>
        <button class="login-theme-btn${theme === "dark" ? " active" : ""}" data-act="set-theme" data-theme="dark" title="Dark">${ICON_MOON}</button>
      </div>
      <div class="login-card">
        ${loginState.step === "email" ? renderLoginEmailStep(signup) : ""}
        ${loginState.step === "otp" ? renderLoginOtpStep() : ""}
        ${loginState.step === "done" ? renderLoginDoneStep(signup) : ""}
      </div>
    </main>
  </div>`;
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "login-tab") { loginState.mode = el.dataset.mode; loginState.emailError = ""; render(); }
  else if (act === "sso-stub") { ssoStub(el.dataset.provider); }
  else if (act === "otp-back") { backToLoginEmail(); }
  else if (act === "otp-verify") { verifyLoginOtp(); }
  else if (act === "otp-resend") { submitLoginEmail({ preventDefault(){} }); }
  else if (act === "toggle-profile-menu") { e.stopImmediatePropagation(); state.profileMenuOpen = !state.profileMenuOpen; render(); }
  else if (act === "view-profile") { state.profileMenuOpen = false; flash("Profile page coming soon"); }
  else if (act === "logout") { state.profileMenuOpen = false; logout(); }
});

document.addEventListener("click", e => {
  if (!state.profileMenuOpen) return;
  if (e.target.closest("#profileMenuTrigger") || e.target.closest("#profileMenuPortal")) return;
  state.profileMenuOpen = false;
  render();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.profileMenuOpen) {
    state.profileMenuOpen = false;
    render();
  }
});

document.addEventListener("submit", e => {
  if (e.target.id === "loginEmailForm") submitLoginEmail(e);
});

document.addEventListener("keydown", e => {
  if (e.target.dataset && e.target.dataset.otpIndex !== undefined) {
    onOtpKeydown(Number(e.target.dataset.otpIndex), e);
  }
});

async function init() {
  document.documentElement.setAttribute("data-theme", getTheme());
  const authed = await checkAuth();
  if (authed) await loadData();
  render();
}
init();
</script>
